```html
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner QR CSSD</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f8;
    }

    .header {
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 18px 10px;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 12px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 15px auto;
      padding: 0 10px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin-top: 0;
      text-align: center;
      font-size: 16px;
    }

    #reader {
      width: 100%;
    }

    .hasil {
      margin-top: 12px;
      padding: 12px;
      background: #e8f5e9;
      border-radius: 8px;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>INSTALASI CSSD</h1>
    <p>RSUD HARAPAN INSAN SENDAWAR</p>
  </div>

  <div class="container">

    <div class="card">

      <h3>📷 SCAN QR CODE</h3>

      <div id="reader"></div>

      <div class="hasil">
        <b>Hasil Scan:</b>
        <div id="hasilScan">Belum ada hasil</div>
      </div>

    </div>

  </div>

  <script>

    // ==========================================
    // GOOGLE APPS SCRIPT
    // ==========================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbw1pGmXUD9Q3v4k6ttlFlcNeiCyM25QZc7FpY_9x341B9Br2pik46FYRqqat95i6i2YAA/exec";


    // Mencegah QR yang sama terkirim berkali-kali
    let sedangMengirim = false;


    // ==========================================
    // KETIKA QR BERHASIL DIBACA
    // ==========================================

    function hasilScan(qrCodeMessage) {

      if (sedangMengirim) {
        return;
      }

      sedangMengirim = true;

      const hasil = document.getElementById("hasilScan");

      hasil.innerText = "⏳ Mengirim data...";

      console.log("QR TERBACA:", qrCodeMessage);


      // ========================================
      // DATA TEST
      // ========================================

      const data = new URLSearchParams();

      data.append("transaksi", "BARANG MASUK");
      data.append("petugas", "TEST");
      data.append("namaBarang", qrCodeMessage);
      data.append("jumlah", "1");
      data.append("ruangan", "TEST");
      data.append("lengkap", "YA");
      data.append("keterangan", "SCAN QR");


      // ========================================
      // KIRIM KE GOOGLE APPS SCRIPT
      // ========================================

      fetch(API_URL, {
        method: "POST",
        body: data
      })

      .then(response => response.json())

      .then(result => {

        console.log("HASIL SERVER:", result);

        if (result.berhasil) {

          hasil.innerText =
            "✅ BERHASIL DISIMPAN\n" +
            qrCodeMessage;

        } else {

          hasil.innerText =
            "❌ GAGAL\n" +
            result.pesan;

        }

        setTimeout(() => {
          sedangMengirim = false;
        }, 2000);

      })

      .catch(error => {

        console.error("ERROR:", error);

        hasil.innerText =
          "❌ GAGAL TERHUBUNG KE GOOGLE SHEET";

        setTimeout(() => {
          sedangMengirim = false;
        }, 2000);

      });

    }


    // ==========================================
    // ERROR SCANNER
    // ==========================================

    function gagalScan(errorMessage) {

      console.log("Scanner:", errorMessage);

    }


    // ==========================================
    // MEMBUAT SCANNER
    // ==========================================

    const scanner = new Html5Qrcode("reader");


    const config = {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    };


    // ==========================================
    // MULAI KAMERA BELAKANG
    // ==========================================

    scanner.start(
      {
        facingMode: "environment"
      },

      config,

      hasilScan,

      gagalScan

    )

    .catch(error => {

      console.error("Kamera gagal:", error);

      document.getElementById("hasilScan").innerText =
        "❌ Kamera tidak dapat digunakan. " +
        "Pastikan izin kamera sudah diberikan.";

    });

  </script>

</body>
</html>
```
