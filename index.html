<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner QR CSSD</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f8;
    }

    .header {
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 18px 10px;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 12px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 15px auto;
      padding: 0 10px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin-top: 0;
      text-align: center;
      font-size: 16px;
    }

    #reader {
      width: 100%;
    }

    .hasil {
      margin-top: 12px;
      padding: 12px;
      background: #e8f5e9;
      border-radius: 8px;
      word-break: break-word;
    }

    @media (max-width: 480px) {
      .header h1 {
        font-size: 18px;
      }

      .container {
        padding: 0 8px;
      }

      .card {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>INSTALASI CSSD</h1>
    <p>RSUD HARAPAN INSAN SENDAWAR</p>
  </div>

  <div class="container">

    <div class="card">
      <h3>📷 SCAN QR CODE</h3>

      <div id="reader"></div>

      <div class="hasil">
        <b>Hasil Scan:</b>
        <div id="hasilScan">Belum ada hasil</div>
      </div>

    </div>

  </div>

  <script>

    // ==============================
    // GOOGLE APPS SCRIPT
    // ==============================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbwnFIiu6mE5yX7FTkGqJqoNxVP_98WW2jvz5REHccdZhd-BfgbXuH7jBoVmx9H72xWkrQ/exec";


    // ==============================
    // HASIL SCAN
    // ==============================

    function hasilScan(qrCodeMessage) {

      document.getElementById("hasilScan").innerText =
        qrCodeMessage;

      console.log("QR TERBACA:", qrCodeMessage);

    }


    // ==============================
    // ERROR SCAN
    // ==============================

    function gagalScan(errorMessage) {

      // Error scan biasa tidak ditampilkan
      console.log("Scanner:", errorMessage);

    }


    // ==============================
    // BUAT SCANNER
    // ==============================

    const html5QrCode =
      new Html5Qrcode("reader");


    const config = {

      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    };


    // ==============================
    // MULAI KAMERA BELAKANG
    // ==============================

    html5QrCode.start(

      {
        facingMode: "environment"
      },

      config,

      hasilScan,

      gagalScan

    ).catch(function(error) {

      console.error(
        "Kamera belakang gagal:",
        error
      );

      document.getElementById("hasilScan").innerText =
        "Kamera tidak dapat digunakan. Pastikan izin kamera sudah diberikan.";

    });


  </script>

</body>
</html>
