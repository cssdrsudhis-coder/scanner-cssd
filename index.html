<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner QR CSSD</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f8;
      color: #0f172a;
    }

    .header {
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 18px 10px;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 12px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 14px auto;
      padding: 0 10px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    .card h3 {
      margin: 0 0 12px;
      text-align: center;
      font-size: 16px;
    }

    /* =========================
       SCANNER
       ========================= */

    #reader {
      width: 100%;
      max-width: 320px;
      margin: auto;
    }

    .scan-status {
      margin-top: 10px;
      padding: 11px;
      border-radius: 9px;
      background: #f1f5f9;
      text-align: center;
      font-weight: bold;
    }

    .small {
      font-size: 12px;
      color: #64748b;
      text-align: center;
      margin-top: 7px;
    }

    /* =========================
       FORM
       ========================= */

    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
      font-size: 13px;
    }

    select,
    input,
    textarea,
    button {
      width: 100%;
      font: inherit;
    }

    select,
    input,
    textarea {
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: white;
    }

    textarea {
      min-height: 75px;
      resize: vertical;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .primary {
      background: #16a34a;
      color: white;
    }

    .danger {
      background: #dc2626;
      color: white;
    }

    .secondary {
      background: #e2e8f0;
      color: #0f172a;
    }

    /* =========================
       QR CONFIRM
       ========================= */

    .qr-text {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      padding: 10px;
      background: #f8fafc;
      border-radius: 8px;
      word-break: break-word;
    }

    /* =========================
       HASIL
       ========================= */

    .result {
      padding: 12px;
      border-radius: 9px;
      background: #e8f5e9;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* =========================
       FOOTER
       ========================= */

    .footer {
      text-align: center;
      padding: 18px 10px 28px;
      color: #64748b;
      font-size: 12px;
    }

    .footer .greeting {
      color: #0f172a;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .footer .health {
      font-size: 12px;
    }

    .footer .credit {
      margin-top: 10px;
      font-size: 11px;
      line-height: 1.6;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
       ========================= -->

  <div class="header">

    <h1>INSTALASI CSSD</h1>

    <p>
      RSUD HARAPAN INSAN SENDAWAR
    </p>

  </div>


  <div class="container">

    <!-- =========================
         SCANNER
         ========================= -->

    <div class="card">

      <h3>
        📷 SCAN QR CODE
      </h3>

      <div id="reader"></div>

      <div
        id="scanStatus"
        class="scan-status"
      >
        Menunggu QR Code...
      </div>

      <div class="small">
        Scan → Periksa → Konfirmasi → Isi Data → Kirim
      </div>

    </div>


    <!-- =========================
         KONFIRMASI QR
         ========================= -->

    <div
      id="confirmCard"
      class="card hidden"
    >

      <h3>
        🔎 KONFIRMASI QR
      </h3>

      <div
        id="qrValue"
        class="qr-text"
      ></div>

      <p style="text-align:center;">
        Apakah QR Code ini benar?
      </p>

      <div class="row">

        <button
          id="btnYa"
          class="primary"
        >
          ✅ YA, LANJUT
        </button>

        <button
          id="btnTidak"
          class="danger"
        >
          ❌ TIDAK, SCAN ULANG
        </button>

      </div>

    </div>


    <!-- =========================
         FORM TRANSAKSI
         ========================= -->

    <div
      id="formCard"
      class="card hidden"
    >

      <h3>
        📝 DATA TRANSAKSI
      </h3>


      <label>
        Jenis Transaksi
      </label>

      <select id="transaksi">

        <option>
          BARANG MASUK
        </option>

        <option>
          PROSES STERIL
        </option>

        <option>
          BARANG KELUAR
        </option>

      </select>


      <label>
        Petugas
      </label>

      <select id="petugas">

        <option value="">
          Memuat petugas...
        </option>

      </select>


      <label>
        Jumlah
      </label>

      <input
        id="jumlah"
        type="number"
        min="1"
        value="1"
      >


      <label>
        Ruangan
      </label>

      <select id="ruangan">

        <option value="">
          Memuat ruangan...
        </option>

      </select>


      <label>
        Lengkap?
      </label>

      <div class="row">

        <button
          type="button"
          id="lengkapYa"
          class="secondary"
        >
          YA
        </button>

        <button
          type="button"
          id="lengkapTidak"
          class="secondary"
        >
          TIDAK
        </button>

      </div>


      <label>
        Keterangan
      </label>

      <textarea
        id="keterangan"
        placeholder="Contoh: Kurang 1 pinset anatomis"
      ></textarea>


      <div style="margin-top:10px;">

        <button
          id="btnKirim"
          class="primary"
        >
          📤 KIRIM KE GOOGLE SHEET
        </button>

      </div>


      <div style="margin-top:8px;">

        <button
          id="btnBatal"
          class="secondary"
        >
          🔄 BATAL / SCAN ULANG
        </button>

      </div>

    </div>


    <!-- =========================
         HASIL
         ========================= -->

    <div
      id="resultCard"
      class="card hidden"
    >

      <div
        id="result"
        class="result"
      ></div>

    </div>

  </div>


  <!-- =========================
       FOOTER
       ========================= -->

  <div class="footer">

    <div class="greeting">
      Selamat Bekerja, Kru CSSD! 💙
    </div>

    <div class="health">
      Semoga Sehat Selalu
    </div>

    <div class="credit">
      © 2026 — Sistem Scanner CSSD<br>
      <i>Dibangun oleh M Dwi Cahyanto</i>
    </div>

  </div>


  <script>

    /* =================================================
       GOOGLE APPS SCRIPT
       ================================================= */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbw1pGmXUD9Q3v4k6ttlFlcNeiCyM25QZc7FpY_9x341B9Br2pik46FYRqqat95i6i2YAA/exec";


    /* =================================================
       VARIABEL
       ================================================= */

    let scanner =
      new Html5Qrcode("reader");

    let qrTertunda = "";

    let lengkap = "";

    let sedangProses = false;

    let masterDimuat = false;


    function $(id) {

      return document.getElementById(id);

    }


    /* =================================================
       STATUS
       ================================================= */

    function setStatus(text) {

      $("scanStatus").innerText =
        text;

    }


    /* =================================================
       TAMPIL / SEMBUNYI
       ================================================= */

    function tampil(el, show) {

      el.classList.toggle(
        "hidden",
        !show
      );

    }


    /* =================================================
       AMBIL MASTER PETUGAS + RUANGAN
       ================================================= */

    async function muatMaster() {

      if (masterDimuat) {
        return;
      }

      try {

        const response =
          await fetch(
            API_URL +
            "?action=getMaster",
            {
              method: "GET",
              cache: "no-store"
            }
          );


        const result =
          await response.json();


        if (!result.berhasil) {

          throw new Error(
            result.pesan ||
            "Gagal mengambil master data."
          );

        }


        /* PETUGAS */

        $("petugas").innerHTML =
          '<option value="">-- Pilih Petugas --</option>';


        (result.petugas || [])
          .forEach(nama => {

            const option =
              document.createElement("option");

            option.value =
              nama;

            option.textContent =
              nama;

            $("petugas")
              .appendChild(option);

          });


        /* RUANGAN */

        $("ruangan").innerHTML =
          '<option value="">-- Pilih Ruangan --</option>';


        (result.ruangan || [])
          .forEach(nama => {

            const option =
              document.createElement("option");

            option.value =
              nama;

            option.textContent =
              nama;

            $("ruangan")
              .appendChild(option);

          });


        masterDimuat = true;


      } catch (error) {

        console.error(error);

        $("petugas").innerHTML =
          '<option value="">Gagal memuat petugas</option>';

        $("ruangan").innerHTML =
          '<option value="">Gagal memuat ruangan</option>';

      }

    }


    /* =================================================
       MULAI SCANNER
       ================================================= */

    async function mulaiScanner() {

      try {

        await scanner.start(

          {
            facingMode: "environment"
          },

          {
            fps: 10,

            qrbox: {
              width: 210,
              height: 210
            }
          },

          ketikaScanBerhasil,

          () => {}

        );


        setStatus(
          "Menunggu QR Code..."
        );


      } catch (error) {

        console.error(error);

        setStatus(
          "❌ Kamera tidak dapat digunakan. Izinkan akses kamera."
        );

      }

    }


    /* =================================================
       HENTIKAN SCANNER
       ================================================= */

    async function hentikanScanner() {

      try {

        const state =
          scanner.getState();


        if (
          state === 2 ||
          state === 3
        ) {

          await scanner.stop();

        }

      } catch (error) {

        console.log(
          "Scanner sudah berhenti."
        );

      }

    }


    /* =================================================
       QR BERHASIL DIBACA
       ================================================= */

    async function ketikaScanBerhasil(
      decodedText
    ) {

      if (
        sedangProses ||
        qrTertunda
      ) {

        return;

      }


      sedangProses = true;


      qrTertunda =
        decodedText;


      /*
       * PENTING:
       * Kamera langsung dihentikan.
       *
       * Jadi QR tidak akan terbaca
       * berkali-kali / spam.
       */

      await hentikanScanner();


      $("qrValue").innerText =
        decodedText;


      tampil(
        $("confirmCard"),
        true
      );


      tampil(
        $("formCard"),
        false
      );


      tampil(
        $("resultCard"),
        false
      );


      setStatus(
        "QR terbaca. Menunggu konfirmasi..."
      );


      sedangProses = false;

    }


    /* =================================================
       TIDAK - SCAN ULANG
       ================================================= */

    $("btnTidak").onclick =
      async function() {

        qrTertunda = "";

        tampil(
          $("confirmCard"),
          false
        );

        tampil(
          $("formCard"),
          false
        );

        setStatus(
          "Scan dibatalkan. Silakan scan QR ulang."
        );

        await mulaiScanner();

      };


    /* =================================================
       YA - LANJUT
       ================================================= */

    $("btnYa").onclick =
      async function() {

        if (!qrTertunda) {
          return;
        }


        await muatMaster();


        tampil(
          $("confirmCard"),
          false
        );


        tampil(
          $("formCard"),
          true
        );


        setStatus(
          "QR dikonfirmasi. Lengkapi data sebelum dikirim."
        );


        $("petugas").focus();

      };


    /* =================================================
       LENGKAP YA
       ================================================= */

    $("lengkapYa").onclick =
      function() {

        lengkap =
          "YA";


        $("lengkapYa").className =
          "primary";


        $("lengkapTidak").className =
          "secondary";

      };


    /* =================================================
       LENGKAP TIDAK
       ================================================= */

    $("lengkapTidak").onclick =
      function() {

        lengkap =
          "TIDAK";


        $("lengkapTidak").className =
          "danger";


        $("lengkapYa").className =
          "secondary";

      };


    /* =================================================
       BATAL / SCAN ULANG
       ================================================= */

    $("btnBatal").onclick =
      async function() {

        qrTertunda = "";

        lengkap = "";


        $("keterangan").value =
          "";


        $("jumlah").value =
          1;


        $("lengkapYa").className =
          "secondary";


        $("lengkapTidak").className =
          "secondary";


        tampil(
          $("formCard"),
          false
        );


        tampil(
          $("resultCard"),
          false
        );


        setStatus(
          "Scan ulang..."
        );


        await mulaiScanner();

      };


    /* =================================================
       KIRIM KE GOOGLE SHEET
       ================================================= */

    $("btnKirim").onclick =
      async function() {

        if (!qrTertunda) {

          alert(
            "QR Code belum ada."
          );

          return;

        }


        if (!$("petugas").value) {

          alert(
            "Pilih petugas terlebih dahulu."
          );

          return;

        }


        if (!$("ruangan").value) {

          alert(
            "Pilih ruangan terlebih dahulu."
          );

          return;

        }


        if (!lengkap) {

          alert(
            "Pilih Lengkap? YA atau TIDAK."
          );

          return;

        }


        if (
          Number(
            $("jumlah").value
          ) < 1
        ) {

          alert(
            "Jumlah minimal 1."
          );

          return;

        }


        $("btnKirim").disabled =
          true;

        $("btnBatal").disabled =
          true;


        setStatus(
          "⏳ Mengirim data ke Google Sheet..."
        );


        const data =
          new URLSearchParams();


        data.append(
          "action",
          "simpanTransaksi"
        );


        data.append(
          "transaksi",
          $("transaksi").value
        );


        data.append(
          "petugas",
          $("petugas").value
        );


        data.append(
          "namaBarang",
          qrTertunda
        );


        data.append(
          "jumlah",
          $("jumlah").value
        );


        data.append(
          "ruangan",
          $("ruangan").value
        );


        data.append(
          "lengkap",
          lengkap
        );


        data.append(
          "keterangan",
          $("keterangan")
            .value
            .trim()
        );


        try {

          const response =
            await fetch(
              API_URL,
              {
                method: "POST",
                body: data,
                cache: "no-store"
              }
            );


          const result =
            await response.json();


          tampil(
            $("resultCard"),
            true
          );


          if (result.berhasil) {

            $("result").innerText =

              "✅ DATA BERHASIL DISIMPAN\n\n" +

              "No: " +
              result.nomor +

              "\nBarang: " +
              result.namaBarang +

              "\nJumlah: " +
              result.jumlah +

              "\nRuangan: " +
              result.ruangan;


            qrTertunda = "";

            lengkap = "";


            tampil(
              $("formCard"),
              false
            );


            setStatus(
              "✅ Berhasil. Siap scan QR berikutnya."
            );


            setTimeout(
              async function() {

                tampil(
                  $("resultCard"),
                  false
                );

                await mulaiScanner();

              },
              1200
            );


          } else {

            $("result").innerText =

              "❌ GAGAL\n" +

              (
                result.pesan ||
                "Data tidak tersimpan."
              );


            setStatus(
              "Data gagal dikirim. Periksa kembali."
            );

          }


        } catch (error) {

          console.error(error);


          tampil(
            $("resultCard"),
            true
          );


          $("result").innerText =

            "❌ GAGAL TERHUBUNG KE GOOGLE SHEET\n\n" +

            "Periksa koneksi internet dan izin akses.";


          setStatus(
            "Pengiriman gagal."
          );

        }


        finally {

          $("btnKirim").disabled =
            false;

          $("btnBatal").disabled =
            false;

        }

      };


    /* =================================================
       MULAI APLIKASI
       ================================================= */

    mulaiScanner();

  </script>

</body>
</html>
