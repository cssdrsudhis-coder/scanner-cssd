<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner QR CSSD</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f8;
      color: #1e293b;
    }

    .header {
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 18px 10px;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 12px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 15px auto;
      padding: 0 10px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      font-size: 14px;
    }

    select,
    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 15px;
      background: white;
    }

    textarea {
      min-height: 70px;
      resize: vertical;
    }

    .field {
      margin-bottom: 15px;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-tambah {
      margin-top: 8px;
      background: #e2e8f0;
      color: #0f172a;
    }

    .jumlah {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .jumlah button {
      width: 48px;
      height: 45px;
      border: none;
      border-radius: 9px;
      background: #0f172a;
      color: white;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    .jumlah input {
      text-align: center;
      font-weight: bold;
      font-size: 18px;
    }

    .kondisi {
      display: flex;
      gap: 10px;
    }

    .kondisi button {
      flex: 1;
      padding: 13px;
      border: 2px solid #cbd5e1;
      border-radius: 9px;
      background: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .kondisi button.aktif {
      background: #0f172a;
      color: white;
      border-color: #0f172a;
    }

    #reader {
      width: 100%;
    }

    .hasil {
      margin-top: 12px;
      padding: 12px;
      background: #f1f5f9;
      border-radius: 9px;
      word-break: break-word;
      text-align: center;
    }

    .status {
      font-weight: bold;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      padding: 25px 15px;
    }

    .modal-box {
      max-width: 400px;
      margin: 60px auto;
      background: white;
      border-radius: 14px;
      padding: 20px;
    }

    .modal-box h3 {
      margin-top: 0;
      text-align: center;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .modal-buttons button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-simpan {
      background: #0f172a;
      color: white;
    }

    .btn-batal {
      background: #e2e8f0;
      color: #0f172a;
    }

    @media (max-width: 480px) {
      .header h1 {
        font-size: 18px;
      }

      .container {
        padding: 0 8px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>INSTALASI CSSD</h1>
    <p>RSUD HARAPAN INSAN SENDAWAR</p>
  </div>

  <div class="container">

    <!-- FORM TRANSAKSI -->
    <div class="card">

      <div class="field">
        <label class="label">👤 Petugas</label>

        <input
          type="text"
          id="petugas"
          value="TEST"
          readonly
        >
      </div>


      <div class="field">

        <label class="label">
          🔄 Jenis Transaksi
        </label>

        <select id="transaksi">

          <option value="BARANG MASUK">
            BARANG MASUK
          </option>

          <option value="PROSES STERIL">
            PROSES STERIL
          </option>

          <option value="BARANG KELUAR">
            BARANG KELUAR
          </option>

        </select>

      </div>


      <div class="field">

        <label class="label">
          🏥 Ruangan
        </label>

        <select id="ruangan">

          <option value="">
            Memuat ruangan...
          </option>

        </select>

        <button
          class="btn btn-tambah"
          onclick="bukaTambahRuangan()"
        >
          ＋ Tambah Ruangan
        </button>

      </div>


      <div class="field">

        <label class="label">
          🔢 Jumlah Set
        </label>

        <div class="jumlah">

          <button onclick="ubahJumlah(-1)">
            −
          </button>

          <input
            type="number"
            id="jumlah"
            value="1"
            min="1"
          >

          <button onclick="ubahJumlah(1)">
            ＋
          </button>

        </div>

      </div>


      <div class="field">

        <label class="label">
          Kondisi Set
        </label>

        <div class="kondisi">

          <button
            id="btnYa"
            onclick="pilihLengkap('YA')"
          >
            ✅ YA
          </button>

          <button
            id="btnTidak"
            onclick="pilihLengkap('TIDAK')"
          >
            ❌ TIDAK
          </button>

        </div>

      </div>


      <div class="field">

        <label class="label">
          📝 Keterangan
        </label>

        <textarea
          id="keterangan"
          placeholder="Opsional..."
        ></textarea>

      </div>

    </div>


    <!-- SCANNER -->
    <div class="card">

      <h3 style="text-align:center;">
        📷 SCAN QR CODE
      </h3>

      <div id="reader"></div>

      <div class="hasil">

        <b>Status:</b>

        <div
          id="hasilScan"
          class="status"
        >
          Siap melakukan scan
        </div>

      </div>

    </div>

  </div>


  <!-- MODAL TAMBAH RUANGAN -->

  <div
    id="modalRuangan"
    class="modal"
  >

    <div class="modal-box">

      <h3>＋ Tambah Ruangan</h3>

      <div class="field">

        <label class="label">
          PIN Admin
        </label>

        <input
          type="password"
          id="pinAdmin"
          placeholder="Masukkan PIN"
        >

      </div>

      <div class="field">

        <label class="label">
          Nama Ruangan
        </label>

        <input
          type="text"
          id="namaRuangan"
          placeholder="Contoh: Ruang Mawar"
        >

      </div>

      <div class="modal-buttons">

        <button
          class="btn-batal"
          onclick="tutupTambahRuangan()"
        >
          Batal
        </button>

        <button
          class="btn-simpan"
          onclick="simpanRuangan()"
        >
          Simpan
        </button>

      </div>

    </div>

  </div>


  <script>

    // ==========================================
    // GOOGLE APPS SCRIPT
    // ==========================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbw1pGmXUD9Q3v4k6ttlFlcNeiCyM25QZc7FpY_9x341B9Br2pik46FYRqqat95i6i2YAA/exec";


    let lengkapDipilih = "";

    let sedangMengirim = false;


    // ==========================================
    // JUMLAH
    // ==========================================

    function ubahJumlah(nilai) {

      const input =
        document.getElementById("jumlah");

      let jumlah =
        Number(input.value) || 1;

      jumlah += nilai;

      if (jumlah < 1) {
        jumlah = 1;
      }

      input.value = jumlah;

    }


    // ==========================================
    // PILIH YA / TIDAK
    // ==========================================

    function pilihLengkap(nilai) {

      lengkapDipilih = nilai;

      document
        .getElementById("btnYa")
        .classList.remove("aktif");

      document
        .getElementById("btnTidak")
        .classList.remove("aktif");


      if (nilai === "YA") {

        document
          .getElementById("btnYa")
          .classList.add("aktif");

      } else {

        document
          .getElementById("btnTidak")
          .classList.add("aktif");

      }

    }


    // ==========================================
    // AMBIL RUANGAN
    // ==========================================

    function muatRuangan() {

      const select =
        document.getElementById("ruangan");

      select.innerHTML =
        '<option value="">Memuat ruangan...</option>';


      fetch(
        API_URL + "?action=getRuangan"
      )

      .then(response => response.json())

      .then(result => {

        select.innerHTML =
          '<option value="">Pilih Ruangan</option>';


        if (
          result.berhasil &&
          Array.isArray(result.data)
        ) {

          result.data.forEach(ruangan => {

            const option =
              document.createElement("option");

            option.value = ruangan;
            option.textContent = ruangan;

            select.appendChild(option);

          });

        }

      })

      .catch(error => {

        console.error(error);

        select.innerHTML =
          '<option value="">Gagal memuat ruangan</option>';

      });

    }


    // ==========================================
    // MODAL TAMBAH RUANGAN
    // ==========================================

    function bukaTambahRuangan() {

      document
        .getElementById("modalRuangan")
        .style.display = "block";

      document
        .getElementById("pinAdmin")
        .value = "";

      document
        .getElementById("namaRuangan")
        .value = "";

    }


    function tutupTambahRuangan() {

      document
        .getElementById("modalRuangan")
        .style.display = "none";

    }


    // ==========================================
    // SIMPAN RUANGAN
    // ==========================================

    function simpanRuangan() {

      const pin =
        document
          .getElementById("pinAdmin")
          .value
          .trim();

      const namaRuangan =
        document
          .getElementById("namaRuangan")
          .value
          .trim();


      if (!pin) {

        alert("PIN Admin belum diisi.");

        return;

      }


      if (!namaRuangan) {

        alert("Nama ruangan belum diisi.");

        return;

      }


      const data =
        new URLSearchParams();

      data.append(
        "action",
        "tambahRuangan"
      );

      data.append(
        "pin",
        pin
      );

      data.append(
        "namaRuangan",
        namaRuangan
      );


      fetch(API_URL, {

        method: "POST",

        body: data

      })

      .then(response => response.json())

      .then(result => {

        if (result.berhasil) {

          alert(
            "✅ Ruangan berhasil ditambahkan."
          );

          tutupTambahRuangan();

          muatRuangan();

          setTimeout(() => {

            document
              .getElementById("ruangan")
              .value = result.ruangan;

          }, 500);

        } else {

          alert(
            "❌ " + result.pesan
          );

        }

      })

      .catch(error => {

        console.error(error);

        alert(
          "❌ Gagal terhubung ke server."
        );

      });

    }


    // ==========================================
    // HASIL SCAN
    // ==========================================

    function hasilScan(qrCodeMessage) {

      if (sedangMengirim) {
        return;
      }


      // ----------------------------------------
      // VALIDASI FORM
      // ----------------------------------------

      const petugas =
        document
          .getElementById("petugas")
          .value
          .trim();

      const transaksi =
        document
          .getElementById("transaksi")
          .value;

      const ruangan =
        document
          .getElementById("ruangan")
          .value;

      const jumlah =
        Number(
          document
            .getElementById("jumlah")
            .value
        );

      const keterangan =
        document
          .getElementById("keterangan")
          .value
          .trim();


      if (!petugas) {

        alert("Petugas belum ditentukan.");

        return;

      }


      if (!ruangan) {

        alert("Silakan pilih ruangan terlebih dahulu.");

        return;

      }


      if (!jumlah || jumlah < 1) {

        alert("Jumlah harus minimal 1.");

        return;

      }


      if (!lengkapDipilih) {

        alert("Silakan pilih YA atau TIDAK.");

        return;

      }


      sedangMengirim = true;


      const hasil =
        document.getElementById("hasilScan");

      hasil.innerText =
        "⏳ Mengirim data...";


      // ----------------------------------------
      // DATA
      // ----------------------------------------

      const data =
        new URLSearchParams();

      data.append(
        "action",
        "simpanTransaksi"
      );

      data.append(
        "transaksi",
        transaksi
      );

      data.append(
        "petugas",
        petugas
      );

      data.append(
        "namaBarang",
        qrCodeMessage
      );

      data.append(
        "jumlah",
        jumlah
      );

      data.append(
        "ruangan",
        ruangan
      );

      data.append(
        "lengkap",
        lengkapDipilih
      );

      data.append(
        "keterangan",
        keterangan
      );


      // ----------------------------------------
      // KIRIM
      // ----------------------------------------

      fetch(API_URL, {

        method: "POST",

        body: data

      })

      .then(response => response.json())

      .then(result => {

        console.log(
          "HASIL SERVER:",
          result
        );


        if (result.berhasil) {

          hasil.innerText =
            "✅ BERHASIL DISIMPAN\n" +
            qrCodeMessage;

        } else {

          hasil.innerText =
            "❌ GAGAL\n" +
            result.pesan;

        }


        setTimeout(() => {

          sedangMengirim = false;

        }, 2000);

      })

      .catch(error => {

        console.error(
          "ERROR:",
          error
        );

        hasil.innerText =
          "❌ GAGAL TERHUBUNG KE GOOGLE SHEET";


        setTimeout(() => {

          sedangMengirim = false;

        }, 2000);

      });

    }


    // ==========================================
    // ERROR SCANNER
    // ==========================================

    function gagalScan(errorMessage) {

      console.log(
        "Scanner:",
        errorMessage
      );

    }


    // ==========================================
    // SCANNER
    // ==========================================

    const scanner =
      new Html5Qrcode("reader");


    const config = {

      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    };


    scanner.start(

      {
        facingMode: "environment"
      },

      config,

      hasilScan,

      gagalScan

    )

    .catch(error => {

      console.error(
        "Kamera gagal:",
        error
      );

      document
        .getElementById("hasilScan")
        .innerText =
          "❌ Kamera tidak dapat digunakan.";

    });


    // ==========================================
    // MULAI
    // ==========================================

    muatRuangan();

  </script>

</body>
</html>
