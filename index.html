<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner QR CSSD</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f8;
      color: #0f172a;
    }

    /* ==============================
       HEADER
    ============================== */

    .header {
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 20px 10px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 14px;
    }


    /* ==============================
       CONTAINER
    ============================== */

    .container {
      width: 100%;
      max-width: 680px;
      margin: 15px auto;
      padding: 0 12px;
    }


    /* ==============================
       CARD
    ============================== */

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin: 0 0 15px;
      text-align: center;
      font-size: 20px;
    }


    /* ==============================
       FORM
    ============================== */

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      font-size: 14px;
    }

    select,
    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      background: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }


    /* ==============================
       PETUGAS AKTIF
    ============================== */

    .petugasAktif {
      background: #e8f1ff;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 15px;
      font-weight: bold;
    }


    /* ==============================
       SCANNER
    ============================== */

    #reader {
      width: 100%;
      max-width: 520px;
      margin: auto;
      overflow: hidden;
      border-radius: 12px;
    }

    #reader video {
      width: 100% !important;
      border-radius: 12px;
    }


    /* ==============================
       HASIL SCAN
    ============================== */

    .hasil {
      margin-top: 15px;
      padding: 14px;
      background: #f1f5f9;
      border-radius: 12px;
      word-break: break-word;
    }

    .hasilTitle {
      font-weight: bold;
      margin-bottom: 6px;
    }

    #hasilScan {
      font-size: 16px;
    }


    /* ==============================
       TOMBOL YA TIDAK
    ============================== */

    .pilihanLengkap {
      display: flex;
      gap: 10px;
    }

    .btnLengkap {
      flex: 1;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #e5e7eb;
    }

    .btnLengkap.aktif {
      background: #16a34a;
      color: white;
    }


    /* ==============================
       TOMBOL AKSI SCAN
    ============================== */

    .aksiScan {
      display: none;
      gap: 10px;
      margin-top: 15px;
    }

    .aksiScan button {
      flex: 1;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btnKirim {
      background: #2563eb;
      color: white;
    }

    .btnUlang {
      background: #64748b;
      color: white;
    }


    /* ==============================
       TOMBOL TAMBAH RUANGAN
    ============================== */

    .btnTambah {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #0f766e;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }


    /* ==============================
       MODAL
    ============================== */

    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.55);
      padding: 20px;
    }

    .modalBox {
      max-width: 450px;
      margin: 80px auto;
      background: white;
      border-radius: 16px;
      padding: 20px;
    }

    .modalBox h3 {
      margin-top: 0;
    }

    .modalActions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .modalActions button {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .btnSimpan {
      background: #16a34a;
      color: white;
    }

    .btnBatal {
      background: #64748b;
      color: white;
    }


    /* ==============================
       STATUS
    ============================== */

    .status {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      text-align: center;
    }

    .status.sukses {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .status.gagal {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .status.proses {
      display: block;
      background: #fef3c7;
      color: #92400e;
    }


    /* ==============================
       FOOTER
    ============================== */

    .footer {
      text-align: center;
      padding: 25px 15px 40px;
      color: #64748b;
      font-size: 14px;
    }

    .footer strong {
      color: #334155;
    }


    /* ==============================
       MOBILE
    ============================== */

    @media (max-width: 480px) {

      .header h1 {
        font-size: 22px;
      }

      .container {
        padding: 0 10px;
      }

      .card {
        padding: 15px;
      }

      .card h2 {
        font-size: 19px;
      }

    }

  </style>

</head>


<body>


  <!-- ==============================
       HEADER
  ============================== -->

  <div class="header">

    <h1>INSTALASI CSSD</h1>

    <p>RSUD HARAPAN INSAN SENDAWAR</p>

  </div>



  <div class="container">


    <!-- ==============================
         SCANNER PALING ATAS
    ============================== -->

    <div class="card">

      <h2>📷 SCAN QR CODE</h2>

      <div id="reader"></div>

      <div class="hasil">

        <div class="hasilTitle">
          Hasil Scan:
        </div>

        <div id="hasilScan">
          Menunggu QR Code...
        </div>

      </div>


      <!-- TOMBOL KIRIM / SCAN ULANG -->

      <div class="aksiScan" id="aksiScan">

        <button
          class="btnKirim"
          onclick="kirimData()">
          Kirim Data
        </button>

        <button
          class="btnUlang"
          onclick="scanUlang()">
          Scan Ulang
        </button>

      </div>


      <div
        id="status"
        class="status">
      </div>

    </div>



    <!-- ==============================
         DATA TRANSAKSI
    ============================== -->

    <div class="card">

      <h2>📋 DATA TRANSAKSI</h2>


      <!-- PETUGAS -->

      <div class="field">

        <label>Petugas</label>

        <div
          id="petugasAktif"
          class="petugasAktif">
          👤 Petugas aktif: -
        </div>

        <select id="petugas">

          <option value="">
            Pilih Petugas
          </option>

        </select>

      </div>



      <!-- TRANSAKSI -->

      <div class="field">

        <label>Jenis Transaksi</label>

        <select id="transaksi">

          <option value="BARANG MASUK">
            BARANG MASUK
          </option>

          <option value="PROSES STERIL">
            PROSES STERIL
          </option>

          <option value="BARANG KELUAR">
            BARANG KELUAR
          </option>

        </select>

      </div>



      <!-- RUANGAN -->

      <div class="field">

        <label>Ruangan</label>

        <select id="ruangan">

          <option value="">
            Pilih Ruangan
          </option>

        </select>

        <button
          class="btnTambah"
          onclick="bukaTambahRuangan()">

          + Tambah Ruangan

        </button>

      </div>



      <!-- JUMLAH -->

      <div class="field">

        <label>Jumlah</label>

        <input
          id="jumlah"
          type="number"
          min="1"
          value="1">

      </div>



      <!-- LENGKAP -->

      <div class="field">

        <label>Lengkap</label>

        <div class="pilihanLengkap">

          <button
            id="btnYa"
            class="btnLengkap"
            onclick="pilihLengkap('YA')">
            YA
          </button>

          <button
            id="btnTidak"
            class="btnLengkap"
            onclick="pilihLengkap('TIDAK')">
            TIDAK
          </button>

        </div>

      </div>



      <!-- KETERANGAN -->

      <div class="field">

        <label>Keterangan</label>

        <textarea
          id="keterangan"
          placeholder="Contoh: Kurang 1 pinset anatomis"></textarea>

      </div>

    </div>


  </div>



  <!-- ==============================
       FOOTER
  ============================== -->

  <div class="footer">

    <div>
      Selamat bekerja 🙏
    </div>

    <div>
      Sehat selalu untuk seluruh kru CSSD ❤️
    </div>

    <br>

    <div>
      Sistem ini dibangun oleh
      <strong>M Dwi Cahyanto</strong>
    </div>

  </div>



  <!-- ==============================
       MODAL TAMBAH RUANGAN
  ============================== -->

  <div
    id="modalRuangan"
    class="modal">

    <div class="modalBox">

      <h3>Tambah Ruangan</h3>

      <div class="field">

        <label>Nama Ruangan</label>

        <input
          id="namaRuangan"
          type="text"
          placeholder="Masukkan nama ruangan">

      </div>

      <div class="field">

        <label>PIN Admin</label>

        <input
          id="pinAdmin"
          type="password"
          placeholder="Masukkan PIN Admin">

      </div>

      <div class="modalActions">

        <button
          class="btnSimpan"
          onclick="simpanRuangan()">
          Simpan
        </button>

        <button
          class="btnBatal"
          onclick="tutupTambahRuangan()">
          Batal
        </button>

      </div>

    </div>

  </div>



  <script>


    /* =====================================================
       GOOGLE APPS SCRIPT
    ===================================================== */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbw1pGmXUD9Q3v4k6ttlFlcNeiCyM25QZc7FpY_9x341B9Br2pik46FYRqqat95i6i2YAA/exec";


    /* =====================================================
       VARIABEL
    ===================================================== */

    let scanner = null;

    let qrHasil = "";

    let lengkapDipilih = "";

    let sedangScan = true;

    let sedangMengirim = false;



    /* =====================================================
       AMBIL DATA PETUGAS
    ===================================================== */

    function loadPetugas() {

      fetch(API_URL + "?action=getPetugas")

        .then(response => response.json())

        .then(result => {

          if (!result.berhasil) {
            throw new Error(result.pesan);
          }

          const select =
            document.getElementById("petugas");

          select.innerHTML =
            '<option value="">Pilih Petugas</option>';


          result.data.forEach(function(nama) {

            const option =
              document.createElement("option");

            option.value = nama;
            option.textContent = nama;

            select.appendChild(option);

          });

        })

        .catch(error => {

          console.error(
            "Gagal mengambil petugas:",
            error
          );

        });

    }



    /* =====================================================
       PETUGAS BERUBAH
    ===================================================== */

    document
      .getElementById("petugas")
      .addEventListener("change", function() {

        const nama = this.value;

        document
          .getElementById("petugasAktif")
          .innerText =
            nama
              ? "👤 Petugas aktif: " + nama
              : "👤 Petugas aktif: -";

      });



    /* =====================================================
       AMBIL DATA RUANGAN
    ===================================================== */

    function loadRuangan() {

      fetch(API_URL + "?action=getRuangan")

        .then(response => response.json())

        .then(result => {

          if (!result.berhasil) {
            throw new Error(result.pesan);
          }

          const select =
            document.getElementById("ruangan");

          select.innerHTML =
            '<option value="">Pilih Ruangan</option>';


          result.data.forEach(function(nama) {

            const option =
              document.createElement("option");

            option.value = nama;
            option.textContent = nama;

            select.appendChild(option);

          });

        })

        .catch(error => {

          console.error(
            "Gagal mengambil ruangan:",
            error
          );

        });

    }



    /* =====================================================
       PILIH YA / TIDAK
    ===================================================== */

    function pilihLengkap(nilai) {

      lengkapDipilih = nilai;


      document
        .getElementById("btnYa")
        .classList.remove("aktif");

      document
        .getElementById("btnTidak")
        .classList.remove("aktif");


      if (nilai === "YA") {

        document
          .getElementById("btnYa")
          .classList.add("aktif");

      }


      if (nilai === "TIDAK") {

        document
          .getElementById("btnTidak")
          .classList.add("aktif");

      }

    }



    /* =====================================================
       SCANNER
    ===================================================== */

    function mulaiScanner() {

      if (scanner) {
        return;
      }


      scanner =
        new Html5Qrcode("reader");


      const config = {

        fps: 10,

        qrbox: {
          width: 220,
          height: 220
        }

      };


      scanner.start(

        {
          facingMode: "environment"
        },

        config,

        ketikaQRTerbaca,

        ketikaScanGagal

      )

      .catch(function(error) {

        console.error(
          "Kamera gagal:",
          error
        );

        document
          .getElementById("hasilScan")
          .innerText =
            "Kamera tidak dapat digunakan. Pastikan izin kamera diberikan.";

      });

    }



    /* =====================================================
       QR TERBACA
    ===================================================== */

    function ketikaQRTerbaca(qrCodeMessage) {

      if (!sedangScan) {
        return;
      }


      sedangScan = false;

      qrHasil = qrCodeMessage;


      document
        .getElementById("hasilScan")
        .innerText =
          qrCodeMessage;


      document
        .getElementById("aksiScan")
        .style.display =
          "flex";


      tampilStatus(
        "Periksa data terlebih dahulu. Pilih Kirim Data atau Scan Ulang.",
        "proses"
      );


      // Jeda scanner agar QR tidak terbaca berkali-kali

      if (scanner) {

        scanner.pause(true);

      }

    }



    /* =====================================================
       ERROR SCAN
    ===================================================== */

    function ketikaScanGagal(errorMessage) {

      // Tidak menampilkan error scan biasa

    }



    /* =====================================================
       SCAN ULANG
    ===================================================== */

    function scanUlang() {

      qrHasil = "";

      sedangScan = true;


      document
        .getElementById("hasilScan")
        .innerText =
          "Menunggu QR Code...";


      document
        .getElementById("aksiScan")
        .style.display =
          "none";


      sembunyikanStatus();


      if (scanner) {

        try {
          scanner.resume();
        } catch (error) {
          console.log(error);
        }

      }

    }



    /* =====================================================
       KIRIM DATA
    ===================================================== */

    function kirimData() {

      if (sedangMengirim) {
        return;
      }


      /* -------------------------------
         VALIDASI QR
      -------------------------------- */

      if (!qrHasil) {

        alert("QR Code belum terbaca.");

        return;

      }


      /* -------------------------------
         VALIDASI PETUGAS
      -------------------------------- */

      const petugas =
        document
          .getElementById("petugas")
          .value;


      if (!petugas) {

        alert("Silakan pilih petugas.");

        return;

      }


      /* -------------------------------
         VALIDASI RUANGAN
      -------------------------------- */

      const ruangan =
        document
          .getElementById("ruangan")
          .value;


      if (!ruangan) {

        alert("Silakan pilih ruangan.");

        return;

      }


      /* -------------------------------
         VALIDASI LENGKAP
      -------------------------------- */

      if (
        lengkapDipilih !== "YA" &&
        lengkapDipilih !== "TIDAK"
      ) {

        alert("Silakan pilih YA atau TIDAK.");

        return;

      }


      /* -------------------------------
         JUMLAH
      -------------------------------- */

      const jumlah =
        Number(
          document
            .getElementById("jumlah")
            .value
        );


      if (!jumlah || jumlah < 1) {

        alert("Jumlah minimal 1.");

        return;

      }


      /* -------------------------------
         TRANSAKSI
      -------------------------------- */

      const transaksi =
        document
          .getElementById("transaksi")
          .value;


      /* -------------------------------
         KETERANGAN
      -------------------------------- */

      const keterangan =
        document
          .getElementById("keterangan")
          .value
          .trim();


      /* -------------------------------
         MULAI KIRIM
      -------------------------------- */

      sedangMengirim = true;


      tampilStatus(
        "⏳ Mengirim data ke Google Sheet...",
        "proses"
      );


      const data =
        new URLSearchParams();


      data.append(
        "action",
        "simpanTransaksi"
      );

      data.append(
        "transaksi",
        transaksi
      );

      data.append(
        "petugas",
        petugas
      );

      data.append(
        "namaBarang",
        qrHasil
      );

      data.append(
        "jumlah",
        jumlah
      );

      data.append(
        "ruangan",
        ruangan
      );

      data.append(
        "lengkap",
        lengkapDipilih
      );

      data.append(
        "keterangan",
        keterangan
      );


      fetch(API_URL, {

        method: "POST",

        body: data

      })

      .then(function(response) {

        return response.json();

      })

      .then(function(result) {

        console.log(
          "HASIL SERVER:",
          result
        );


        if (result.berhasil) {

          tampilStatus(
            "✅ Data berhasil disimpan ke Google Sheet.",
            "sukses"
          );


          document
            .getElementById("hasilScan")
            .innerText =
              "Berhasil disimpan: " +
              qrHasil;


          document
            .getElementById("aksiScan")
            .style.display =
              "none";


          // Reset QR agar scanner siap untuk data berikutnya

          setTimeout(function() {

            scanUlang();

          }, 1800);


        } else {

          tampilStatus(
            "❌ " + result.pesan,
            "gagal"
          );

          sedangScan = false;

        }


        sedangMengirim = false;

      })

      .catch(function(error) {

        console.error(
          "ERROR KIRIM:",
          error
        );


        tampilStatus(
          "❌ Gagal terhubung ke Google Sheet.",
          "gagal"
        );


        sedangMengirim = false;

      });

    }



    /* =====================================================
       STATUS
    ===================================================== */

    function tampilStatus(pesan, tipe) {

      const status =
        document.getElementById("status");


      status.innerText = pesan;

      status.className =
        "status " + tipe;

    }


    function sembunyikanStatus() {

      const status =
        document.getElementById("status");

      status.innerText = "";

      status.className =
        "status";

    }



    /* =====================================================
       TAMBAH RUANGAN
    ===================================================== */

    function bukaTambahRuangan() {

      document
        .getElementById("modalRuangan")
        .style.display =
          "block";

    }


    function tutupTambahRuangan() {

      document
        .getElementById("modalRuangan")
        .style.display =
          "none";


      document
        .getElementById("namaRuangan")
        .value = "";

      document
        .getElementById("pinAdmin")
        .value = "";

    }



    /* =====================================================
       SIMPAN RUANGAN BARU
    ===================================================== */

    function simpanRuangan() {

      const namaRuangan =
        document
          .getElementById("namaRuangan")
          .value
          .trim();


      const pin =
        document
          .getElementById("pinAdmin")
          .value
          .trim();


      if (!namaRuangan) {

        alert("Nama ruangan belum diisi.");

        return;

      }


      if (!pin) {

        alert("PIN Admin belum diisi.");

        return;

      }


      const data =
        new URLSearchParams();


      data.append(
        "action",
        "tambahRuangan"
      );

      data.append(
        "namaRuangan",
        namaRuangan
      );

      data.append(
        "pin",
        pin
      );


      fetch(API_URL, {

        method: "POST",

        body: data

      })

      .then(function(response) {

        return response.json();

      })

      .then(function(result) {

        if (result.berhasil) {

          alert(
            "Ruangan berhasil ditambahkan."
          );


          tutupTambahRuangan();

          loadRuangan();


          setTimeout(function() {

            document
              .getElementById("ruangan")
              .value =
                result.ruangan;

          }, 500);


        } else {

          alert(result.pesan);

        }

      })

      .catch(function(error) {

        console.error(error);

        alert(
          "Gagal terhubung ke Google Sheet."
        );

      });

    }



    /* =====================================================
       MULAI APLIKASI
    ===================================================== */

    window.addEventListener(
      "load",
      function() {

        loadPetugas();

        loadRuangan();

        mulaiScanner();

      }
    );


  </script>

</body>

</html>
