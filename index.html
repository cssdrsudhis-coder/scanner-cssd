<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scanner QR CSSD</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef3f8;
  color: #0f172a;
}

/* ================= HEADER ================= */

.header {
  background: #0f172a;
  color: white;
  text-align: center;
  padding: 18px 10px;
}

.header h1 {
  margin: 0;
  font-size: 21px;
}

.header p {
  margin: 6px 0 0;
  font-size: 13px;
}

/* ================= CONTAINER ================= */

.container {
  width: 100%;
  max-width: 480px;
  margin: 15px auto;
  padding: 0 10px;
}

/* ================= CARD ================= */

.card {
  background: white;
  border-radius: 15px;
  padding: 15px;
  margin-bottom: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.card h3 {
  margin: 0 0 14px;
  text-align: center;
  font-size: 17px;
}

/* ================= SCANNER ================= */

#reader {
  width: 100%;
  max-width: 330px;
  margin: auto;
}

#reader video {
  border-radius: 10px;
}

/* ================= HASIL SCAN ================= */

.hasil {
  margin-top: 14px;
  padding: 13px;
  background: #f1f5f9;
  border-radius: 10px;
  word-break: break-word;
}

.hasil-title {
  font-weight: bold;
  font-size: 15px;
  margin-bottom: 7px;
}

#hasilScan {
  font-size: 15px;
  font-weight: 600;
}

/* ================= KONFIRMASI ================= */

#konfirmasi {
  display: none;
  margin-top: 14px;
  padding: 15px;
  background: #fff7ed;
  border: 1px solid #fed7aa;
  border-radius: 12px;
}

#konfirmasi h4 {
  margin: 0 0 8px;
  text-align: center;
  font-size: 16px;
}

.qr-data {
  background: white;
  padding: 10px;
  border-radius: 8px;
  word-break: break-word;
  margin-bottom: 12px;
}

/* ================= INPUT ================= */

label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 5px;
}

select,
input,
textarea {
  width: 100%;
  padding: 11px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 14px;
  background: white;
}

textarea {
  min-height: 75px;
  resize: vertical;
}

/* ================= FORM ================= */

.form-group {
  margin-bottom: 12px;
}

.ruangan-row {
  display: flex;
  gap: 7px;
}

.ruangan-row select {
  flex: 1;
}

.btn-tambah {
  width: auto;
  white-space: nowrap;
  padding: 10px 12px;
}

/* ================= BUTTON ================= */

button {
  border: none;
  border-radius: 9px;
  padding: 12px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.btn-ya {
  width: 100%;
  background: #16a34a;
  color: white;
  margin-bottom: 8px;
}

.btn-tidak {
  width: 100%;
  background: #dc2626;
  color: white;
}

.btn-simpan {
  width: 100%;
  background: #2563eb;
  color: white;
  margin-top: 5px;
}

.btn-scan {
  width: 100%;
  background: #475569;
  color: white;
  margin-top: 10px;
}

/* ================= STATUS ================= */

.status {
  display: none;
  margin-top: 12px;
  padding: 12px;
  border-radius: 9px;
  text-align: center;
  font-weight: bold;
}

.status.sukses {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.status.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

/* ================= FOOTER ================= */

.footer {
  text-align: center;
  padding: 18px 10px 25px;
  color: #64748b;
  font-size: 12px;
}

.footer strong {
  color: #334155;
}

/* ================= PETUGAS / RUANGAN ================= */

#formData {
  display: none;
}

/* ================= MOBILE ================= */

@media (max-width: 480px) {

  .header h1 {
    font-size: 19px;
  }

  .container {
    padding: 0 8px;
  }

  .card {
    padding: 13px;
  }

  #reader {
    max-width: 300px;
  }

}

</style>

</head>

<body>

<!-- ================= HEADER ================= -->

<div class="header">

  <h1>INSTALASI CSSD</h1>

  <p>
    RSUD HARAPAN INSAN SENDAWAR
  </p>

</div>


<div class="container">


<!-- ================= SCANNER ================= -->

<div class="card">

  <h3>📷 SCAN QR CODE</h3>

  <div id="reader"></div>


  <div class="hasil">

    <div class="hasil-title">
      Hasil Scan:
    </div>

    <div id="hasilScan">
      Menunggu QR Code...
    </div>

  </div>


  <!-- ================= KONFIRMASI ================= -->

  <div id="konfirmasi">

    <h4>
      📋 Konfirmasi Data
    </h4>

    <div class="qr-data">

      <b>QR Code:</b>

      <div id="qrKonfirmasi"></div>

    </div>

    <div style="text-align:center;margin-bottom:10px;">
      Apakah data ini akan dikirim ke Google Sheet?
    </div>

    <button
      class="btn-ya"
      onclick="lanjutKirim()">

      ✅ YA, KIRIM

    </button>


    <button
      class="btn-tidak"
      onclick="scanUlang()">

      ❌ TIDAK, SCAN ULANG

    </button>

  </div>

</div>


<!-- ================= FORM DATA ================= -->

<div
  class="card"
  id="formData">

  <h3>📝 DATA TRANSAKSI</h3>


  <!-- PETUGAS -->

  <div class="form-group">

    <label>
      Petugas
    </label>

    <select id="petugas">

      <option value="">
        Pilih Petugas
      </option>

    </select>

  </div>


  <!-- RUANGAN -->

  <div class="form-group">

    <label>
      Ruangan
    </label>

    <div class="ruangan-row">

      <select id="ruangan">

        <option value="">
          Pilih Ruangan
        </option>

      </select>


      <button
        class="btn-tambah"
        onclick="tambahRuangan()">

        ➕ Tambah

      </button>

    </div>

  </div>


  <!-- JUMLAH -->

  <div class="form-group">

    <label>
      Jumlah
    </label>

    <input
      type="number"
      id="jumlah"
      value="1"
      min="1">

  </div>


  <!-- KETERANGAN -->

  <div class="form-group">

    <label>
      Keterangan
    </label>

    <textarea
      id="keterangan"
      placeholder="Contoh: Kurang pinset anatomis, klem jaringan, dll."></textarea>

  </div>


  <button
    class="btn-simpan"
    onclick="kirimData()">

    📤 KIRIM KE GOOGLE SHEET

  </button>


  <button
    class="btn-scan"
    onclick="scanUlang()">

    📷 SCAN QR LAIN

  </button>


  <div
    id="status"
    class="status">
  </div>

</div>


</div>


<!-- ================= FOOTER ================= -->

<div class="footer">

  <div>
    Selamat bekerja 🙏
  </div>

  <div>
    Sehat selalu untuk seluruh kru CSSD ❤️
  </div>

  <br>

  <div>
    Sistem ini dibangun oleh
    <strong>M Dwi Cahyanto</strong>
  </div>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT
   ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbw1pGmXUD9Q3v4k6ttlFlcNeiCyM25QZc7FpY_9x341B9Br2pik46FYRqqat95i6i2YAA/exec";


/* =====================================================
   VARIABEL
   ===================================================== */

let scanner = null;

let qrHasil = "";

let sedangScan = false;


/* =====================================================
   ELEMENT
   ===================================================== */

const hasilScan =
document.getElementById("hasilScan");

const konfirmasi =
document.getElementById("konfirmasi");

const formData =
document.getElementById("formData");

const qrKonfirmasi =
document.getElementById("qrKonfirmasi");


/* =====================================================
   MULAI SCANNER
   ===================================================== */

function mulaiScanner() {

  if (scanner) {
    return;
  }

  scanner =
    new Html5Qrcode("reader");


  const config = {

    fps: 10,

    qrbox: {
      width: 220,
      height: 220
    }

  };


  scanner.start(

    {
      facingMode: "environment"
    },

    config,

    berhasilScan,

    gagalScan

  )

  .then(() => {

    sedangScan = true;

  })

  .catch(error => {

    console.error(error);

    hasilScan.innerText =
      "❌ Kamera tidak dapat digunakan.";

  });

}


/* =====================================================
   QR BERHASIL DIBACA
   ===================================================== */

function berhasilScan(qrCodeMessage) {

  if (!sedangScan) {
    return;
  }


  sedangScan = false;

  qrHasil = qrCodeMessage;


  hasilScan.innerText =
    "QR Code berhasil dibaca.";


  qrKonfirmasi.innerText =
    qrCodeMessage;


  konfirmasi.style.display =
    "block";


  // Hentikan kamera sementara
  if (scanner) {

    scanner.stop()
      .then(() => {

        scanner.clear();

        scanner = null;

      })
      .catch(error => {

        console.log(error);

        scanner = null;

      });

  }

}


/* =====================================================
   ERROR SCAN
   ===================================================== */

function gagalScan(errorMessage) {

  console.log(
    "Scanner:",
    errorMessage
  );

}


/* =====================================================
   TIDAK - SCAN ULANG
   ===================================================== */

function scanUlang() {

  qrHasil = "";

  konfirmasi.style.display =
    "none";

  formData.style.display =
    "none";


  hasilScan.innerText =
    "Menunggu QR Code...";


  document.getElementById("status").style.display =
    "none";


  mulaiScanner();

}


/* =====================================================
   YA - LANJUT
   ===================================================== */

function lanjutKirim() {

  konfirmasi.style.display =
    "none";

  formData.style.display =
    "block";


  // Scroll otomatis ke form

  setTimeout(() => {

    formData.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  }, 100);

}


/* =====================================================
   AMBIL PETUGAS
   ===================================================== */

function loadPetugas() {

  fetch(
    API_URL +
    "?action=getPetugas"
  )

  .then(response =>
    response.json()
  )

  .then(result => {

    if (!result.berhasil) {
      return;
    }


    const select =
      document.getElementById("petugas");


    select.innerHTML =
      '<option value="">Pilih Petugas</option>';


    result.data.forEach(nama => {

      const option =
        document.createElement("option");

      option.value = nama;

      option.textContent = nama;

      select.appendChild(option);

    });

  })

  .catch(error => {

    console.error(
      "Petugas:",
      error
    );

  });

}


/* =====================================================
   AMBIL RUANGAN
   ===================================================== */

function loadRuangan() {

  fetch(
    API_URL +
    "?action=getRuangan"
  )

  .then(response =>
    response.json()
  )

  .then(result => {

    if (!result.berhasil) {
      return;
    }


    const select =
      document.getElementById("ruangan");


    select.innerHTML =
      '<option value="">Pilih Ruangan</option>';


    result.data.forEach(nama => {

      const option =
        document.createElement("option");

      option.value = nama;

      option.textContent = nama;

      select.appendChild(option);

    });

  })

  .catch(error => {

    console.error(
      "Ruangan:",
      error
    );

  });

}


/* =====================================================
   TAMBAH RUANGAN
   ===================================================== */

function tambahRuangan() {

  const nama =
    prompt(
      "Masukkan nama ruangan baru:"
    );


  if (!nama) {
    return;
  }


  const pin =
    prompt(
      "Masukkan PIN Admin:"
    );


  if (!pin) {
    return;
  }


  const data =
    new URLSearchParams();


  data.append(
    "action",
    "tambahRuangan"
  );

  data.append(
    "namaRuangan",
    nama
  );

  data.append(
    "pin",
    pin
  );


  fetch(
    API_URL,
    {
      method: "POST",
      body: data
    }
  )

  .then(response =>
    response.json()
  )

  .then(result => {

    if (result.berhasil) {

      alert(
        "✅ Ruangan berhasil ditambahkan."
      );

      loadRuangan();

    } else {

      alert(
        "❌ " + result.pesan
      );

    }

  })

  .catch(error => {

    console.error(error);

    alert(
      "❌ Gagal menambahkan ruangan."
    );

  });

}


/* =====================================================
   KIRIM TRANSAKSI
   ===================================================== */

function kirimData() {

  const petugas =
    document.getElementById("petugas").value;


  const ruangan =
    document.getElementById("ruangan").value;


  const jumlah =
    document.getElementById("jumlah").value;


  const keterangan =
    document.getElementById("keterangan").value;


  if (!petugas) {

    alert(
      "Silakan pilih petugas."
    );

    return;

  }


  if (!ruangan) {

    alert(
      "Silakan pilih ruangan."
    );

    return;

  }


  if (!jumlah || jumlah < 1) {

    alert(
      "Jumlah minimal 1."
    );

    return;

  }


  const data =
    new URLSearchParams();


  data.append(
    "transaksi",
    "BARANG MASUK"
  );

  data.append(
    "petugas",
    petugas
  );

  data.append(
    "namaBarang",
    qrHasil
  );

  data.append(
    "jumlah",
    jumlah
  );

  data.append(
    "ruangan",
    ruangan
  );

  data.append(
    "lengkap",
    "YA"
  );

  data.append(
    "keterangan",
    keterangan
  );


  const status =
    document.getElementById("status");


  status.className =
    "status";


  status.style.display =
    "block";


  status.innerText =
    "⏳ Mengirim data ke Google Sheet...";


  fetch(
    API_URL,
    {
      method: "POST",
      body: data
    }
  )

  .then(response =>
    response.json()
  )

  .then(result => {

    console.log(
      "HASIL SERVER:",
      result
    );


    if (result.berhasil) {

      status.className =
        "status sukses";


      status.innerText =
        "✅ Data berhasil disimpan ke Google Sheet.";


      hasilScan.innerText =
        "Berhasil disimpan: " +
        qrHasil;


      // Reset form

      document.getElementById("petugas")
        .value = "";

      document.getElementById("ruangan")
        .value = "";

      document.getElementById("jumlah")
        .value = "1";

      document.getElementById("keterangan")
        .value = "";


      // Setelah 2 detik siap scan lagi

      setTimeout(() => {

        formData.style.display =
          "none";

        status.style.display =
          "none";

        scanUlang();

      }, 2000);


    } else {

      status.className =
        "status error";


      status.innerText =
        "❌ " + result.pesan;

    }

  })

  .catch(error => {

    console.error(
      "ERROR:",
      error
    );


    status.className =
      "status error";


    status.innerText =
      "❌ Gagal terhubung ke Google Sheet.";

  });

}


/* =====================================================
   JALANKAN
   ===================================================== */

loadPetugas();

loadRuangan();

mulaiScanner();

</script>

</body>
</html>
