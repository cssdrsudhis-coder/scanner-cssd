<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Scanner QR CSSD</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef3f8;
  color: #172033;
}

.header {
  background: #0f172a;
  color: white;
  text-align: center;
  padding: 16px 10px;
}

.header h1 {
  margin: 0;
  font-size: 20px;
}

.header p {
  margin: 5px 0 0;
  font-size: 12px;
}

.container {
  width: 100%;
  max-width: 480px;
  margin: 12px auto;
  padding: 0 10px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.card h3 {
  margin: 0 0 10px;
  text-align: center;
  font-size: 16px;
}

label {
  display: block;
  margin-top: 10px;
  margin-bottom: 5px;
  font-weight: bold;
  font-size: 13px;
}

select,
input,
textarea {
  width: 100%;
  padding: 11px;
  border: 1px solid #ccd4df;
  border-radius: 8px;
  font-size: 14px;
  background: white;
}

textarea {
  min-height: 75px;
  resize: vertical;
}

button {
  width: 100%;
  border: 0;
  border-radius: 9px;
  padding: 12px;
  margin-top: 9px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.btn-scan {
  background: #2563eb;
  color: white;
}

.btn-kirim {
  background: #16a34a;
  color: white;
}

.btn-ulangi {
  background: #f59e0b;
  color: white;
}

.btn-tambah {
  background: #64748b;
  color: white;
}

.btn-tutup {
  background: #dc2626;
  color: white;
}

#reader {
  width: 100%;
  max-width: 340px;
  margin: auto;
}

.hasil {
  margin-top: 10px;
  padding: 11px;
  background: #f1f5f9;
  border-radius: 8px;
  word-break: break-word;
  font-size: 14px;
}

.konfirmasi {
  display: none;
  margin-top: 10px;
  padding: 12px;
  background: #fff7ed;
  border-radius: 10px;
  border: 1px solid #fed7aa;
}

.konfirmasi p {
  margin: 0 0 8px;
  font-size: 14px;
  font-weight: bold;
}

.dua-tombol {
  display: flex;
  gap: 8px;
}

.dua-tombol button {
  width: 50%;
}

.btn-ya {
  background: #16a34a;
  color: white;
}

.btn-tidak {
  background: #dc2626;
  color: white;
}

.detail {
  display: none;
}

.info-petugas {
  background: #eff6ff;
  padding: 10px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 8px;
}

.status {
  text-align: center;
  margin-top: 8px;
  font-size: 13px;
  font-weight: bold;
}

.footer {
  text-align: center;
  padding: 15px 10px 25px;
  font-size: 11px;
  color: #64748b;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 1000;
}

.modal-box {
  background: white;
  width: 100%;
  max-width: 400px;
  border-radius: 14px;
  padding: 18px;
}

.modal-box h3 {
  margin-top: 0;
  text-align: center;
}

</style>

</head>


<body>


<div class="header">

  <h1>INSTALASI CSSD</h1>

  <p>
    RSUD HARAPAN INSAN SENDAWAR
  </p>

</div>


<div class="container">


<!-- =====================================
     PETUGAS
===================================== -->

<div class="card">

  <h3>👤 PETUGAS</h3>

  <div
    id="infoPetugas"
    class="info-petugas"
  >
    Memuat petugas...
  </div>

  <select id="petugas">

    <option value="">
      Pilih Petugas
    </option>

  </select>

</div>


<!-- =====================================
     SCANNER
===================================== -->

<div class="card">

  <h3>📷 SCAN QR CODE</h3>

  <div id="reader"></div>

  <div class="hasil">

    <b>Hasil Scan:</b>

    <div id="hasilScan">
      Belum ada hasil
    </div>

  </div>


  <!-- KONFIRMASI QR -->

  <div
    id="konfirmasi"
    class="konfirmasi"
  >

    <p>
      Apakah QR Code ini benar?
    </p>

    <div class="dua-tombol">

      <button
        class="btn-ya"
        onclick="qrBenar()"
      >
        YA
      </button>

      <button
        class="btn-tidak"
        onclick="scanUlang()"
      >
        TIDAK
      </button>

    </div>

  </div>


  <button
    id="btnScanUlang"
    class="btn-ulangi"
    onclick="scanUlang()"
    style="display:none;"
  >
    🔄 SCAN ULANG
  </button>

</div>


<!-- =====================================
     DETAIL TRANSAKSI
===================================== -->

<div
  id="detail"
  class="card detail"
>

  <h3>📋 DATA TRANSAKSI</h3>


  <label>
    Jenis Transaksi
  </label>

  <select id="transaksi">

    <option value="BARANG MASUK">
      BARANG MASUK
    </option>

    <option value="PROSES STERIL">
      PROSES STERIL
    </option>

    <option value="BARANG KELUAR">
      BARANG KELUAR
    </option>

  </select>


  <label>
    Nama / Kode Barang
  </label>

  <input
    id="namaBarang"
    type="text"
    readonly
  >


  <label>
    Jumlah
  </label>

  <input
    id="jumlah"
    type="number"
    min="1"
    value="1"
  >


  <label>
    Ruangan
  </label>

  <select id="ruangan">

    <option value="">
      Pilih Ruangan
    </option>

  </select>


  <button
    class="btn-tambah"
    onclick="bukaTambahRuangan()"
  >
    ➕ TAMBAH RUANGAN
  </button>


  <label>
    Apakah instrumen lengkap?
  </label>

  <div class="dua-tombol">

    <button
      id="lengkapYa"
      class="btn-ya"
      onclick="pilihLengkap('YA')"
    >
      YA
    </button>

    <button
      id="lengkapTidak"
      class="btn-tidak"
      onclick="pilihLengkap('TIDAK')"
    >
      TIDAK
    </button>

  </div>


  <input
    type="hidden"
    id="lengkap"
  >


  <label>
    Keterangan
  </label>

  <textarea
    id="keterangan"
    placeholder="Contoh: kurang pinset anatomis, klem jaringan, dll."
  ></textarea>


  <button
    class="btn-kirim"
    onclick="kirimData()"
  >
    📤 KIRIM KE GOOGLE SHEET
  </button>


  <button
    class="btn-ulangi"
    onclick="scanUlang()"
  >
    🔄 BATAL / SCAN ULANG
  </button>


  <div
    id="status"
    class="status"
  ></div>

</div>


</div>


<!-- =====================================
     MODAL TAMBAH RUANGAN
===================================== -->

<div
  id="modalRuangan"
  class="modal"
>

  <div class="modal-box">

    <h3>
      ➕ TAMBAH RUANGAN
    </h3>


    <label>
      PIN ADMIN
    </label>

    <input
      id="pinAdmin"
      type="password"
      placeholder="Masukkan PIN"
    >


    <label>
      Nama Ruangan
    </label>

    <input
      id="namaRuangan"
      type="text"
      placeholder="Contoh: IBS"
    >


    <button
      class="btn-kirim"
      onclick="simpanRuangan()"
    >
      SIMPAN RUANGAN
    </button>


    <button
      class="btn-tutup"
      onclick="tutupTambahRuangan()"
    >
      TUTUP
    </button>

  </div>

</div>


<!-- =====================================
     FOOTER
===================================== -->

<div class="footer">

  <div>
    Selamat bekerja, sehat selalu untuk kru CSSD ❤️
  </div>

  <br>

  <div>
    Sistem ini dibangun oleh
    <b>M Dwi Cahyanto</b>
  </div>

</div>


<script>


/* =========================================
   GOOGLE APPS SCRIPT
========================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbw1pGmXUD9Q3v4k6ttlFlcNeiCyM25QZc7FpY_9x341B9Br2pik46FYRqqat95i6i2YAA/exec";


/* =========================================
   VARIABEL
========================================= */

let scanner = null;

let sedangScan = false;

let sedangMengirim = false;

let qrTerakhir = "";

let petugasDariLink = "";


/* =========================================
   AMBIL PETUGAS DARI URL
========================================= */

function ambilPetugasDariURL() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const nama =
    params.get("petugas");

  if (nama) {

    petugasDariLink =
      decodeURIComponent(
        nama
      ).trim();

  }

}


/* =========================================
   LOAD MASTER
========================================= */

async function loadMaster() {

  try {

    const response =
      await fetch(
        API_URL +
        "?action=getMaster"
      );

    const result =
      await response.json();


    if (!result.berhasil) {

      throw new Error(
        result.pesan
      );

    }


    isiPetugas(
      result.petugas || []
    );

    isiRuangan(
      result.ruangan || []
    );


  } catch (error) {

    console.error(
      "Gagal mengambil master:",
      error
    );

    document.getElementById(
      "infoPetugas"
    ).innerText =
      "⚠️ Gagal mengambil data master.";

  }

}


/* =========================================
   PETUGAS
========================================= */

function isiPetugas(data) {

  const select =
    document.getElementById(
      "petugas"
    );


  select.innerHTML =
    '<option value="">Pilih Petugas</option>';


  data.forEach(
    nama => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        nama;

      option.textContent =
        nama;

      select.appendChild(
        option
      );

    }
  );


  // Jika link memiliki petugas

  if (petugasDariLink) {

    const cocok =
      data.find(
        nama =>
          nama.toLowerCase() ===
          petugasDariLink.toLowerCase()
      );


    if (cocok) {

      select.value =
        cocok;

      select.disabled =
        true;

      document.getElementById(
        "infoPetugas"
      ).innerText =
        "👤 Petugas aktif: " +
        cocok;

      return;

    }

  }


  document.getElementById(
    "infoPetugas"
  ).innerText =
    "Silakan pilih petugas.";

}


/* =========================================
   RUANGAN
========================================= */

function isiRuangan(data) {

  const select =
    document.getElementById(
      "ruangan"
    );


  select.innerHTML =
    '<option value="">Pilih Ruangan</option>';


  data.forEach(
    nama => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        nama;

      option.textContent =
        nama;

      select.appendChild(
        option
      );

    }
  );

}


/* =========================================
   MULAI SCANNER
========================================= */

function mulaiScanner() {

  if (scanner) {
    return;
  }


  scanner =
    new Html5Qrcode(
      "reader"
    );


  const config = {

    fps: 10,

    qrbox: {
      width: 230,
      height: 230
    }

  };


  scanner.start(

    {
      facingMode:
        "environment"
    },

    config,

    hasilScan,

    gagalScan

  )

  .then(() => {

    sedangScan = true;

  })

  .catch(error => {

    console.error(
      "Kamera gagal:",
      error
    );

    document.getElementById(
      "hasilScan"
    ).innerText =
      "❌ Kamera tidak dapat digunakan. " +
      "Pastikan izin kamera diberikan.";

  });

}


/* =========================================
   HASIL QR
========================================= */

function hasilScan(qrCodeMessage) {

  if (!sedangScan) {
    return;
  }


  sedangScan = false;

  qrTerakhir =
    qrCodeMessage;


  document.getElementById(
    "hasilScan"
  ).innerText =
    qrCodeMessage;


  document.getElementById(
    "konfirmasi"
  ).style.display =
    "block";


  hentikanScanner();

}


/* =========================================
   QR BENAR
========================================= */

function qrBenar() {

  document.getElementById(
    "konfirmasi"
  ).style.display =
    "none";


  document.getElementById(
    "namaBarang"
  ).value =
    qrTerakhir;


  document.getElementById(
    "detail"
  ).style.display =
    "block";


  document.getElementById(
    "btnScanUlang"
  ).style.display =
    "none";

}


/* =========================================
   SCAN ULANG
========================================= */

function scanUlang() {

  hentikanScanner();


  sedangScan = false;

  sedangMengirim = false;

  qrTerakhir = "";


  document.getElementById(
    "konfirmasi"
  ).style.display =
    "none";


  document.getElementById(
    "detail"
  ).style.display =
    "none";


  document.getElementById(
    "namaBarang"
  ).value =
    "";


  document.getElementById(
    "hasilScan"
  ).innerText =
    "Silakan scan QR kembali.";


  document.getElementById(
    "status"
  ).innerText =
    "";


  setTimeout(
    mulaiScanner,
    300
  );

}


/* =========================================
   HENTIKAN SCANNER
========================================= */

async function hentikanScanner() {

  if (!scanner) {
    return;
  }


  try {

    await scanner.stop();

  } catch (error) {

    console.log(
      "Scanner sudah berhenti."
    );

  }


  try {

    await scanner.clear();

  } catch (error) {

  }


  scanner = null;

}


/* =========================================
   ERROR SCAN
========================================= */

function gagalScan(errorMessage) {

  console.log(
    "Scanner:",
    errorMessage
  );

}


/* =========================================
   PILIH LENGKAP
========================================= */

function pilihLengkap(nilai) {

  document.getElementById(
    "lengkap"
  ).value =
    nilai;


  const ya =
    document.getElementById(
      "lengkapYa"
    );

  const tidak =
    document.getElementById(
      "lengkapTidak"
    );


  if (nilai === "YA") {

    ya.style.opacity = "1";

    tidak.style.opacity = ".55";

  } else {

    ya.style.opacity = ".55";

    tidak.style.opacity = "1";

  }

}


/* =========================================
   KIRIM DATA
========================================= */

async function kirimData() {

  if (sedangMengirim) {
    return;
  }


  const petugas =
    document.getElementById(
      "petugas"
    ).value;


  const transaksi =
    document.getElementById(
      "transaksi"
    ).value;


  const namaBarang =
    document.getElementById(
      "namaBarang"
    ).value.trim();


  const jumlah =
    document.getElementById(
      "jumlah"
    ).value;


  const ruangan =
    document.getElementById(
      "ruangan"
    ).value;


  const lengkap =
    document.getElementById(
      "lengkap"
    ).value;


  const keterangan =
    document.getElementById(
      "keterangan"
    ).value.trim();


  if (!petugas) {

    alert(
      "Silakan pilih petugas."
    );

    return;

  }


  if (!namaBarang) {

    alert(
      "Nama barang kosong."
    );

    return;

  }


  if (!jumlah || jumlah < 1) {

    alert(
      "Jumlah minimal 1."
    );

    return;

  }


  if (!ruangan) {

    alert(
      "Silakan pilih ruangan."
    );

    return;

  }


  if (
    lengkap !== "YA" &&
    lengkap !== "TIDAK"
  ) {

    alert(
      "Silakan pilih YA atau TIDAK."
    );

    return;

  }


  const yakin =
    confirm(
      "Kirim data ini ke Google Sheet?"
    );


  if (!yakin) {
    return;
  }


  sedangMengirim = true;


  const status =
    document.getElementById(
      "status"
    );


  status.innerText =
    "⏳ Mengirim data...";


  const data =
    new URLSearchParams();


  data.append(
    "action",
    "simpanTransaksi"
  );

  data.append(
    "transaksi",
    transaksi
  );

  data.append(
    "petugas",
    petugas
  );

  data.append(
    "namaBarang",
    namaBarang
  );

  data.append(
    "jumlah",
    jumlah
  );

  data.append(
    "ruangan",
    ruangan
  );

  data.append(
    "lengkap",
    lengkap
  );

  data.append(
    "keterangan",
    keterangan
  );


  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",
          body: data
        }
      );


    const result =
      await response.json();


    if (!result.berhasil) {

      throw new Error(
        result.pesan ||
        "Data gagal disimpan."
      );

    }


    status.innerText =
      "✅ DATA BERHASIL DISIMPAN KE GOOGLE SHEET";


    alert(
      "Data berhasil disimpan."
    );


    // Bersihkan data

    document.getElementById(
      "detail"
    ).style.display =
      "none";


    document.getElementById(
      "hasilScan"
    ).innerText =
      "Silakan scan QR berikutnya.";


    document.getElementById(
      "jumlah"
    ).value =
      "1";


    document.getElementById(
      "ruangan"
    ).value =
      "";


    document.getElementById(
      "lengkap"
    ).value =
      "";


    document.getElementById(
      "keterangan"
    ).value =
      "";


    pilihLengkap("");


    qrTerakhir = "";


    setTimeout(
      mulaiScanner,
      500
    );


  } catch (error) {

    console.error(
      "Gagal mengirim:",
      error
    );


    status.innerText =
      "❌ GAGAL: " +
      error.message;


    alert(
      "Data gagal dikirim.\n\n" +
      error.message
    );


  } finally {

    sedangMengirim =
      false;

  }

}


/* =========================================
   TAMBAH RUANGAN
========================================= */

function bukaTambahRuangan() {

  document.getElementById(
    "modalRuangan"
  ).style.display =
    "flex";

}


function tutupTambahRuangan() {

  document.getElementById(
    "modalRuangan"
  ).style.display =
    "none";

}


/* =========================================
   SIMPAN RUANGAN
========================================= */

async function simpanRuangan() {

  const pin =
    document.getElementById(
      "pinAdmin"
    ).value.trim();


  const namaRuangan =
    document.getElementById(
      "namaRuangan"
    ).value.trim();


  if (!pin) {

    alert(
      "Masukkan PIN Admin."
    );

    return;

  }


  if (!namaRuangan) {

    alert(
      "Masukkan nama ruangan."
    );

    return;

  }


  const data =
    new URLSearchParams();


  data.append(
    "action",
    "tambahRuangan"
  );

  data.append(
    "pin",
    pin
  );

  data.append(
    "namaRuangan",
    namaRuangan
  );


  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",
          body: data
        }
      );


    const result =
      await response.json();


    if (!result.berhasil) {

      throw new Error(
        result.pesan
      );

    }


    alert(
      "Ruangan berhasil ditambahkan."
    );


    document.getElementById(
      "pinAdmin"
    ).value =
      "";


    document.getElementById(
      "namaRuangan"
    ).value =
      "";


    tutupTambahRuangan();


    await loadMaster();


    document.getElementById(
      "ruangan"
    ).value =
      result.ruangan;


  } catch (error) {

    alert(
      "Gagal menambahkan ruangan:\n" +
      error.message
    );

  }

}


/* =========================================
   MULAI
========================================= */

ambilPetugasDariURL();

loadMaster();

mulaiScanner();


</script>


</body>

</html>
