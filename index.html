<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner QR CSSD</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f8;
      color: #172033;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 18px 10px;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 13px;
    }


    /* =========================
       CONTAINER
    ========================= */

    .container {
      width: 100%;
      max-width: 600px;
      margin: 14px auto;
      padding: 0 10px;
    }


    /* =========================
       CARD
    ========================= */

    .card {
      background: white;
      border-radius: 18px;
      padding: 15px;
      margin-bottom: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin: 0 0 12px;
      text-align: center;
      font-size: 18px;
    }


    /* =========================
       SCANNER
    ========================= */

    #reader {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      border-radius: 12px;
    }


    /* =========================
       HASIL SCAN
    ========================= */

    .hasil {
      margin-top: 12px;
      padding: 13px;
      background: #f1f5f9;
      border-radius: 10px;
      word-break: break-word;
      font-size: 15px;
    }

    .hasil-title {
      font-weight: bold;
      margin-bottom: 5px;
    }

    #hasilScan {
      font-size: 16px;
      font-weight: 500;
    }


    /* =========================
       KONFIRMASI QR
    ========================= */

    #konfirmasi {
      display: none;
      margin-top: 12px;
      padding: 15px;
      background: #fff7ed;
      border-radius: 12px;
      border: 1px solid #fed7aa;
      text-align: center;
    }

    #konfirmasi h4 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    #qrKonfirmasi {
      margin: 8px 0 12px;
      padding: 10px;
      background: white;
      border-radius: 8px;
      word-break: break-word;
      font-weight: bold;
    }


    /* =========================
       FORM
    ========================= */

    #formData {
      display: none;
    }

    .label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    select,
    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 15px;
      background: white;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }


    /* =========================
       TOMBOL
    ========================= */

    button {
      border: none;
      border-radius: 9px;
      padding: 12px 15px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .btn-row button {
      flex: 1;
    }

    .btn-ya {
      background: #16a34a;
      color: white;
    }

    .btn-tidak {
      background: #dc2626;
      color: white;
    }

    .btn-kirim {
      width: 100%;
      margin-top: 18px;
      background: #2563eb;
      color: white;
    }

    .btn-scan {
      width: 100%;
      margin-top: 10px;
      background: #475569;
      color: white;
    }

    .btn-tambah {
      margin-top: 8px;
      width: 100%;
      background: #e2e8f0;
      color: #172033;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }


    /* =========================
       STATUS
    ========================= */

    .status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 9px;
      display: none;
      font-size: 14px;
      text-align: center;
    }

    .status.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .status.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .status.info {
      display: block;
      background: #dbeafe;
      color: #1e40af;
    }


    /* =========================
       FOOTER
    ========================= */

    .footer {
      text-align: center;
      padding: 22px 10px 30px;
      color: #64748b;
      font-size: 14px;
      line-height: 1.7;
    }

    .footer strong {
      color: #334155;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 480px) {

      .header h1 {
        font-size: 20px;
      }

      .header p {
        font-size: 12px;
      }

      .container {
        padding: 0 8px;
      }

      .card {
        padding: 12px;
        border-radius: 16px;
      }

      .card h3 {
        font-size: 17px;
      }

      #reader {
        max-width: 380px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================== -->

  <div class="header">

    <h1>INSTALASI CSSD</h1>

    <p>
      RSUD HARAPAN INSAN SENDAWAR
    </p>

  </div>



  <div class="container">


    <!-- =========================
         SCANNER
    ========================== -->

    <div class="card">

      <h3>
        📷 SCAN QR CODE
      </h3>

      <div id="reader"></div>


      <div class="hasil">

        <div class="hasil-title">
          Hasil Scan:
        </div>

        <div id="hasilScan">
          Menunggu QR Code...
        </div>

      </div>


      <!-- =====================
           KONFIRMASI
      ====================== -->

      <div id="konfirmasi">

        <h4>
          QR Code terdeteksi
        </h4>

        <div id="qrKonfirmasi">
        </div>

        <div>
          Apakah data ini akan dikirim?
        </div>


        <div class="btn-row">

          <button
            class="btn-ya"
            onclick="setujuiQR()">
            ✅ YA
          </button>


          <button
            class="btn-tidak"
            onclick="tolakQR()">
            ❌ TIDAK / SCAN ULANG
          </button>

        </div>

      </div>


      <!-- =====================
           TOMBOL SCAN ULANG
      ====================== -->

      <button
        id="btnScanUlang"
        class="btn-scan"
        style="display:none;"
        onclick="scanUlang()">

        📷 SCAN QR ULANG

      </button>

    </div>



    <!-- =========================
         FORM DATA
    ========================== -->

    <div
      class="card"
      id="formData">

      <h3>
        📝 DATA TRANSAKSI
      </h3>


      <!-- PETUGAS -->

      <label class="label">
        Petugas
      </label>

      <select id="petugas">

        <option value="">
          Memuat petugas...
        </option>

      </select>



      <!-- RUANGAN -->

      <label class="label">
        Ruangan
      </label>

      <select id="ruangan">

        <option value="">
          Memuat ruangan...
        </option>

      </select>


      <button
        class="btn-tambah"
        onclick="tambahRuangan()">

        ➕ Tambah Ruangan

      </button>



      <!-- JUMLAH -->

      <label class="label">
        Jumlah
      </label>

      <input
        id="jumlah"
        type="number"
        min="1"
        value="1"
        placeholder="Masukkan jumlah">



      <!-- LENGKAP -->

      <label class="label">
        Lengkap?
      </label>

      <select id="lengkap">

        <option value="">
          Pilih...
        </option>

        <option value="YA">
          YA
        </option>

        <option value="TIDAK">
          TIDAK
        </option>

      </select>



      <!-- KETERANGAN -->

      <label class="label">
        Keterangan
      </label>

      <textarea
        id="keterangan"
        placeholder="Contoh: kurang pinset anatomis 1, klem jaringan 1, atau keterangan lainnya..."></textarea>



      <!-- KIRIM -->

      <button
        id="btnKirim"
        class="btn-kirim"
        onclick="kirimData()">

        📤 KIRIM KE GOOGLE SHEET

      </button>


      <!-- STATUS -->

      <div
        id="status"
        class="status">
      </div>


    </div>

  </div>



  <!-- =========================
       FOOTER
  ========================== -->

  <div class="footer">

    <div>
      Selamat bekerja 🙏
    </div>

    <div>
      Sehat selalu untuk seluruh kru CSSD ❤️
    </div>

    <br>

    <div>
      Sistem ini dibangun oleh
      <strong>M Dwi Cahyanto</strong>
    </div>

  </div>



<script>


/* =====================================================
   GOOGLE APPS SCRIPT
===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbw1pGmXUD9Q3v4k6ttlFlcNeiCyM25QZc7FpY_9x341B9Br2pik46FYRqqat95i6i2YAA/exec";


/* =====================================================
   VARIABEL
===================================================== */

let scanner = null;

let qrTerakhir = "";

let sedangScan = false;

let sedangMengirim = false;


/* =====================================================
   ELEMENT
===================================================== */

const hasilScan =
  document.getElementById("hasilScan");

const konfirmasi =
  document.getElementById("konfirmasi");

const qrKonfirmasi =
  document.getElementById("qrKonfirmasi");

const formData =
  document.getElementById("formData");

const btnScanUlang =
  document.getElementById("btnScanUlang");

const statusBox =
  document.getElementById("status");


/* =====================================================
   MULAI SCANNER
===================================================== */

function mulaiScanner() {

  if (sedangScan) {
    return;
  }

  sedangScan = true;

  scanner =
    new Html5Qrcode("reader");


  const config = {

    fps: 10,

    qrbox: {
      width: 230,
      height: 230
    },

    aspectRatio: 1.0

  };


  scanner.start(

    {
      facingMode: "environment"
    },

    config,

    ketikaQRBerhasil,

    ketikaScanGagal

  )

  .catch(function(error) {

    console.error(
      "Kamera gagal:",
      error
    );

    sedangScan = false;

    hasilScan.innerText =
      "❌ Kamera tidak dapat digunakan. Pastikan izin kamera diberikan.";

  });

}


/* =====================================================
   QR BERHASIL
===================================================== */

async function ketikaQRBerhasil(qrCodeMessage) {

  if (qrTerakhir) {
    return;
  }


  qrTerakhir =
    String(qrCodeMessage).trim();


  hasilScan.innerText =
    qrTerakhir;


  qrKonfirmasi.innerText =
    qrTerakhir;


  konfirmasi.style.display =
    "block";


  formData.style.display =
    "none";


  btnScanUlang.style.display =
    "none";


  // Hentikan kamera sementara
  await hentikanScanner();

}


/* =====================================================
   ERROR SCAN
===================================================== */

function ketikaScanGagal(errorMessage) {

  // Tidak perlu menampilkan error scan biasa

}


/* =====================================================
   HENTIKAN SCANNER
===================================================== */

async function hentikanScanner() {

  if (!scanner) {
    sedangScan = false;
    return;
  }

  try {

    await scanner.stop();

  } catch (error) {

    console.log(
      "Scanner sudah berhenti."
    );

  }

  try {

    scanner.clear();

  } catch (error) {

    console.log(
      "Scanner clear."
    );

  }

  scanner = null;

  sedangScan = false;

}


/* =====================================================
   YA - QR DISETUJUI
===================================================== */

function setujuiQR() {

  if (!qrTerakhir) {
    return;
  }


  konfirmasi.style.display =
    "none";


  formData.style.display =
    "block";


  btnScanUlang.style.display =
    "none";


  hasilScan.innerText =
    qrTerakhir;


  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });

}


/* =====================================================
   TIDAK - SCAN ULANG
===================================================== */

function tolakQR() {

  qrTerakhir = "";


  konfirmasi.style.display =
    "none";


  formData.style.display =
    "none";


  btnScanUlang.style.display =
    "none";


  hasilScan.innerText =
    "Menunggu QR Code...";


  mulaiScanner();

}


/* =====================================================
   SCAN ULANG
===================================================== */

function scanUlang() {

  qrTerakhir = "";


  konfirmasi.style.display =
    "none";


  formData.style.display =
    "none";


  btnScanUlang.style.display =
    "none";


  hasilScan.innerText =
    "Menunggu QR Code...";


  mulaiScanner();

}


/* =====================================================
   LOAD PETUGAS
===================================================== */

function loadPetugas() {

  fetch(
    API_URL +
    "?action=getPetugas"
  )

  .then(response =>
    response.json()
  )

  .then(result => {

    const select =
      document.getElementById("petugas");


    select.innerHTML = "";


    if (
      !result.berhasil ||
      !Array.isArray(result.data)
    ) {

      select.innerHTML =
        '<option value="">Gagal memuat petugas</option>';

      return;

    }


    select.innerHTML =
      '<option value="">Pilih petugas...</option>';


    result.data.forEach(function(nama) {

      const option =
        document.createElement("option");

      option.value =
        nama;

      option.textContent =
        nama;

      select.appendChild(option);

    });

  })

  .catch(error => {

    console.error(
      "Petugas:",
      error
    );

    document.getElementById(
      "petugas"
    ).innerHTML =
      '<option value="">Gagal terhubung</option>';

  });

}


/* =====================================================
   LOAD RUANGAN
===================================================== */

function loadRuangan() {

  fetch(
    API_URL +
    "?action=getRuangan"
  )

  .then(response =>
    response.json()
  )

  .then(result => {

    const select =
      document.getElementById("ruangan");


    select.innerHTML = "";


    if (
      !result.berhasil ||
      !Array.isArray(result.data)
    ) {

      select.innerHTML =
        '<option value="">Gagal memuat ruangan</option>';

      return;

    }


    select.innerHTML =
      '<option value="">Pilih ruangan...</option>';


    result.data.forEach(function(nama) {

      const option =
        document.createElement("option");

      option.value =
        nama;

      option.textContent =
        nama;

      select.appendChild(option);

    });

  })

  .catch(error => {

    console.error(
      "Ruangan:",
      error
    );

    document.getElementById(
      "ruangan"
    ).innerHTML =
      '<option value="">Gagal terhubung</option>';

  });

}


/* =====================================================
   TAMBAH RUANGAN
===================================================== */

function tambahRuangan() {

  const namaRuangan =
    prompt(
      "Masukkan nama ruangan baru:"
    );


  if (!namaRuangan) {
    return;
  }


  const pin =
    prompt(
      "Masukkan PIN Admin:"
    );


  if (!pin) {
    return;
  }


  const data =
    new URLSearchParams();


  data.append(
    "action",
    "tambahRuangan"
  );

  data.append(
    "pin",
    pin
  );

  data.append(
    "namaRuangan",
    namaRuangan.trim()
  );


  fetch(API_URL, {

    method: "POST",

    body: data

  })

  .then(response =>
    response.json()
  )

  .then(result => {

    if (result.berhasil) {

      alert(
        "✅ " +
        result.pesan
      );

      loadRuangan();


    } else {

      alert(
        "❌ " +
        result.pesan
      );

    }

  })

  .catch(error => {

    console.error(
      "Tambah ruangan:",
      error
    );

    alert(
      "❌ Gagal terhubung ke Google Sheet."
    );

  });

}


/* =====================================================
   KIRIM DATA
===================================================== */

function kirimData() {

  if (sedangMengirim) {
    return;
  }


  const petugas =
    document.getElementById(
      "petugas"
    ).value.trim();


  const ruangan =
    document.getElementById(
      "ruangan"
    ).value.trim();


  const jumlah =
    document.getElementById(
      "jumlah"
    ).value;


  const lengkap =
    document.getElementById(
      "lengkap"
    ).value;


  const keterangan =
    document.getElementById(
      "keterangan"
    ).value.trim();


  /* =========================
     VALIDASI
  ========================= */

  if (!qrTerakhir) {

    tampilStatus(
      "❌ QR Code belum ada.",
      "error"
    );

    return;

  }


  if (!petugas) {

    tampilStatus(
      "❌ Silakan pilih petugas.",
      "error"
    );

    return;

  }


  if (!ruangan) {

    tampilStatus(
      "❌ Silakan pilih ruangan.",
      "error"
    );

    return;

  }


  if (
    !jumlah ||
    Number(jumlah) < 1
  ) {

    tampilStatus(
      "❌ Jumlah minimal 1.",
      "error"
    );

    return;

  }


  if (
    lengkap !== "YA" &&
    lengkap !== "TIDAK"
  ) {

    tampilStatus(
      "❌ Silakan pilih YA atau TIDAK pada bagian lengkap.",
      "error"
    );

    return;

  }


  /* =========================
     KONFIRMASI TERAKHIR
  ========================= */

  const yakin =
    confirm(
      "Kirim data QR ini ke Google Sheet?\n\n" +
      "Barang: " + qrTerakhir +
      "\nPetugas: " + petugas +
      "\nRuangan: " + ruangan +
      "\nJumlah: " + jumlah
    );


  if (!yakin) {
    return;
  }


  sedangMengirim = true;


  const btnKirim =
    document.getElementById(
      "btnKirim"
    );


  btnKirim.disabled =
    true;


  btnKirim.innerText =
    "⏳ MENGIRIM...";


  tampilStatus(
    "⏳ Sedang mengirim data ke Google Sheet...",
    "info"
  );


  /* =========================
     DATA
  ========================= */

  const data =
    new URLSearchParams();


  data.append(
    "action",
    "simpanTransaksi"
  );

  data.append(
    "transaksi",
    "BARANG MASUK"
  );

  data.append(
    "petugas",
    petugas
  );

  data.append(
    "namaBarang",
    qrTerakhir
  );

  data.append(
    "jumlah",
    jumlah
  );

  data.append(
    "ruangan",
    ruangan
  );

  data.append(
    "lengkap",
    lengkap
  );

  data.append(
    "keterangan",
    keterangan
  );


  /* =========================
     KIRIM
  ========================= */

  fetch(API_URL, {

    method: "POST",

    body: data

  })

  .then(response =>
    response.json()
  )

  .then(result => {

    console.log(
      "HASIL SERVER:",
      result
    );


    if (result.berhasil) {

      tampilStatus(
        "✅ DATA BERHASIL DISIMPAN KE GOOGLE SHEET. Nomor: " +
        result.nomor,
        "success"
      );


      btnKirim.innerText =
        "✅ BERHASIL DISIMPAN";


      setTimeout(function() {

        resetForm();

      }, 2500);


    } else {

      tampilStatus(
        "❌ GAGAL: " +
        result.pesan,
        "error"
      );


      btnKirim.disabled =
        false;


      btnKirim.innerText =
        "📤 KIRIM KE GOOGLE SHEET";


      sedangMengirim =
        false;

    }

  })

  .catch(error => {

    console.error(
      "ERROR:",
      error
    );


    tampilStatus(
      "❌ GAGAL TERHUBUNG KE GOOGLE SHEET.",
      "error"
    );


    btnKirim.disabled =
      false;


    btnKirim.innerText =
      "📤 KIRIM KE GOOGLE SHEET";


    sedangMengirim =
      false;

  });

}


/* =====================================================
   STATUS
===================================================== */

function tampilStatus(
  pesan,
  tipe
) {

  statusBox.innerText =
    pesan;

  statusBox.className =
    "status " + tipe;

}


/* =====================================================
   RESET SETELAH BERHASIL
===================================================== */

function resetForm() {

  qrTerakhir =
    "";


  document.getElementById(
    "petugas"
  ).value = "";


  document.getElementById(
    "ruangan"
  ).value = "";


  document.getElementById(
    "jumlah"
  ).value = "1";


  document.getElementById(
    "lengkap"
  ).value = "";


  document.getElementById(
    "keterangan"
  ).value = "";


  formData.style.display =
    "none";


  konfirmasi.style.display =
    "none";


  hasilScan.innerText =
    "Menunggu QR Code...";


  statusBox.className =
    "status";


  const btnKirim =
    document.getElementById(
      "btnKirim"
    );


  btnKirim.disabled =
    false;


  btnKirim.innerText =
    "📤 KIRIM KE GOOGLE SHEET";


  sedangMengirim =
    false;


  mulaiScanner();

}


/* =====================================================
   JALANKAN SISTEM
===================================================== */

loadPetugas();

loadRuangan();

mulaiScanner();


</script>

</body>
</html>
