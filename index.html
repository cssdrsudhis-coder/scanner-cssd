<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Scanner QR CSSD</title>

  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f8;
      color: #0f172a;
    }


    /* ==========================================
       HEADER
    ========================================== */

    .header {
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 18px 10px;
    }


    .header h1 {
      margin: 0;
      font-size: 22px;
    }


    .header p {
      margin: 6px 0 0;
      font-size: 13px;
    }


    /* ==========================================
       CONTAINER
    ========================================== */

    .container {
      width: 100%;
      max-width: 520px;
      margin: 15px auto;
      padding: 0 10px;
    }


    /* ==========================================
       CARD
    ========================================== */

    .card {
      background: white;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }


    .card h2 {
      margin: 0 0 15px;
      text-align: center;
      font-size: 19px;
    }


    /* ==========================================
       SCANNER
    ========================================== */

    #reader {
      width: 100%;
      max-width: 420px;
      margin: auto;
      overflow: hidden;
      border-radius: 12px;
    }


    #reader video {
      width: 100% !important;
      max-height: 380px;
      object-fit: cover;
      border-radius: 12px;
    }


    /* ==========================================
       HASIL SCAN
    ========================================== */

    .hasil {
      margin-top: 12px;
      padding: 13px;
      background: #f1f5f9;
      border-radius: 10px;
      word-break: break-word;
    }


    .hasilTitle {
      font-weight: bold;
      margin-bottom: 6px;
    }


    #hasilScan {
      font-size: 15px;
    }


    /* ==========================================
       FIELD
    ========================================== */

    .field {
      margin-bottom: 14px;
    }


    .field label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      font-size: 14px;
    }


    select,
    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      background: white;
    }


    textarea {
      min-height: 85px;
      resize: vertical;
    }


    /* ==========================================
       PETUGAS AKTIF
    ========================================== */

    .petugasAktif {
      margin-top: 8px;
      padding: 10px;
      background: #eff6ff;
      border-radius: 9px;
      font-size: 14px;
      font-weight: bold;
    }


    /* ==========================================
       TOMBOL JENIS TRANSAKSI
    ========================================== */

    .pilihanTransaksi {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }


    .btnTransaksi {
      flex: 1;
      min-width: 140px;
      padding: 13px 8px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
      color: #0f172a;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }


    .btnTransaksi.aktif {
      background: #2563eb;
      border-color: #2563eb;
      color: white;
    }


    .btnTransaksi:active {
      transform: scale(0.98);
    }


    /* ==========================================
       TOMBOL TAMBAH RUANGAN
    ========================================== */

    .btnTambah {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #0f766e;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }


    /* ==========================================
       YA / TIDAK
    ========================================== */

    .pilihanLengkap {
      display: flex;
      gap: 10px;
    }


    .btnLengkap {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #e2e8f0;
      color: #0f172a;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }


    .btnLengkap.aktifYa {
      background: #16a34a;
      color: white;
    }


    .btnLengkap.aktifTidak {
      background: #dc2626;
      color: white;
    }


    /* ==========================================
       TOMBOL SCAN
    ========================================== */

    .aksiScan {
      display: none;
      gap: 10px;
      margin-top: 12px;
    }


    .aksiScan button {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }


    .btnKirim {
      background: #2563eb;
      color: white;
    }


    .btnUlang {
      background: #64748b;
      color: white;
    }


    /* ==========================================
       STATUS
    ========================================== */

    .status {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
    }


    .status.sukses {
      display: block;
      background: #dcfce7;
      color: #166534;
    }


    .status.gagal {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }


    .status.proses {
      display: block;
      background: #fef3c7;
      color: #92400e;
    }


    .status.info {
      display: block;
      background: #dbeafe;
      color: #1e40af;
    }


    /* ==========================================
       FOOTER
    ========================================== */

    .footer {
      text-align: center;
      padding: 20px 10px 35px;
      color: #64748b;
      font-size: 13px;
      line-height: 1.6;
    }


    .footer strong {
      color: #334155;
    }


    /* ==========================================
       MOBILE
    ========================================== */

    @media (max-width: 480px) {

      .header h1 {
        font-size: 20px;
      }


      .container {
        padding: 0 8px;
      }


      .card {
        padding: 13px;
      }


      .btnTransaksi {
        min-width: 100%;
      }


      #reader video {
        max-height: 340px;
      }

    }

  </style>

</head>



<body>


  <!-- ==========================================
       HEADER
  ========================================== -->

  <div class="header">

    <h1>
      INSTALASI CSSD
    </h1>

    <p>
      RSUD HARAPAN INSAN SENDAWAR
    </p>

  </div>



  <div class="container">


    <!-- ==========================================
         SCANNER PALING ATAS
    ========================================== -->

    <div class="card">

      <h2>
        📷 SCAN QR CODE
      </h2>


      <div id="reader"></div>


      <div class="hasil">

        <div class="hasilTitle">
          Hasil Scan:
        </div>


        <div id="hasilScan">
          Menunggu QR Code...
        </div>

      </div>


      <!-- TOMBOL SETELAH QR TERBACA -->

      <div
        id="aksiScan"
        class="aksiScan"
      >

        <button
          class="btnKirim"
          onclick="kirimData()"
        >
          KIRIM DATA
        </button>


        <button
          class="btnUlang"
          onclick="scanUlang()"
        >
          SCAN ULANG
        </button>

      </div>


      <div
        id="status"
        class="status"
      ></div>

    </div>



    <!-- ==========================================
         DATA TRANSAKSI
    ========================================== -->

    <div class="card">

      <h2>
        DATA TRANSAKSI
      </h2>



      <!-- ========================================
           JENIS TRANSAKSI
      ========================================= -->

      <div class="field">

        <label>
          Jenis Transaksi
        </label>


        <div class="pilihanTransaksi">


          <button
            type="button"
            class="btnTransaksi aktif"
            onclick="pilihTransaksi('BARANG MASUK', this)"
          >
            BARANG MASUK
          </button>


          <button
            type="button"
            class="btnTransaksi"
            onclick="pilihTransaksi('PROSES STERIL', this)"
          >
            PROSES STERIL
          </button>


          <button
            type="button"
            class="btnTransaksi"
            onclick="pilihTransaksi('BARANG KELUAR', this)"
          >
            BARANG KELUAR
          </button>


        </div>


        <!-- Nilai yang dikirim ke Google Apps Script -->

        <input
          type="hidden"
          id="transaksi"
          value="BARANG MASUK"
        >

      </div>



      <!-- ========================================
           PETUGAS
      ========================================= -->

      <div class="field">

        <label>
          Petugas
        </label>


        <select id="petugas">

          <option value="">
            Memuat petugas...
          </option>

        </select>


        <div
          id="petugasAktif"
          class="petugasAktif"
        >
          👤 Petugas aktif: -
        </div>

      </div>



      <!-- ========================================
           RUANGAN
      ========================================= -->

      <div class="field">

        <label>
          Ruangan
        </label>


        <select id="ruangan">

          <option value="">
            Memuat ruangan...
          </option>

        </select>


        <button
          class="btnTambah"
          onclick="tambahRuangan()"
        >
          + TAMBAH RUANGAN
        </button>

      </div>



      <!-- ========================================
           JUMLAH
      ========================================= -->

      <div class="field">

        <label>
          Jumlah
        </label>


        <input
          id="jumlah"
          type="number"
          min="1"
          value="1"
        >

      </div>



      <!-- ========================================
           LENGKAP
      ========================================= -->

      <div class="field">

        <label>
          Lengkap
        </label>


        <div class="pilihanLengkap">


          <button
            type="button"
            id="btnYa"
            class="btnLengkap"
            onclick="pilihLengkap('YA')"
          >
            YA
          </button>


          <button
            type="button"
            id="btnTidak"
            class="btnLengkap"
            onclick="pilihLengkap('TIDAK')"
          >
            TIDAK
          </button>


        </div>

      </div>



      <!-- ========================================
           KETERANGAN
      ========================================= -->

      <div class="field">

        <label>
          Keterangan
        </label>


        <textarea
          id="keterangan"
          placeholder="Contoh: Kurang 1 pinset anatomis"
        ></textarea>

      </div>


    </div>



    <!-- ==========================================
         FOOTER
    ========================================== -->

    <div class="footer">

      <div>
        Selamat bekerja 🙏
      </div>


      <div>
        Sehat selalu untuk seluruh kru CSSD ❤️
      </div>


      <br>


      <div>
        Sistem ini dibangun oleh
        <strong>
          M Dwi Cahyanto
        </strong>
      </div>

    </div>


  </div>



  <!-- ==========================================
       JAVASCRIPT
  ========================================== -->

  <script>


    /* ==========================================
       GOOGLE APPS SCRIPT
    ========================================== */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbw1pGmXUD9Q3v4k6ttlFlcNeiCyM25QZc7FpY_9x341B9Br2pik46FYRqqat95i6i2YAA/exec";



    /* ==========================================
       VARIABEL
    ========================================== */

    let scanner = null;

    let qrHasil = "";

    let lengkapDipilih = "";

    let transaksiDipilih = "BARANG MASUK";

    let sedangScan = true;

    let sedangMengirim = false;



    /* ==========================================
       ELEMENT
    ========================================== */

    const hasilScan =
      document.getElementById("hasilScan");

    const aksiScan =
      document.getElementById("aksiScan");

    const status =
      document.getElementById("status");

    const petugas =
      document.getElementById("petugas");

    const ruangan =
      document.getElementById("ruangan");

    const petugasAktif =
      document.getElementById("petugasAktif");



    /* ==========================================
       LOAD PETUGAS
    ========================================== */

    function loadPetugas() {

      fetch(
        API_URL + "?action=getPetugas"
      )

      .then(function(response) {

        return response.json();

      })

      .then(function(result) {

        if (!result.berhasil) {

          throw new Error(
            result.pesan
          );

        }


        petugas.innerHTML =
          '<option value="">Pilih Petugas</option>';


        result.data.forEach(
          function(nama) {

            const option =
              document.createElement(
                "option"
              );


            option.value =
              nama;


            option.textContent =
              nama;


            petugas.appendChild(
              option
            );

          }
        );

      })

      .catch(function(error) {

        console.error(
          "Gagal memuat petugas:",
          error
        );


        petugas.innerHTML =
          '<option value="">Gagal memuat petugas</option>';

      });

    }



    /* ==========================================
       PETUGAS DIPILIH
    ========================================== */

    petugas.addEventListener(
      "change",
      function() {

        const nama =
          this.value || "-";


        petugasAktif.innerText =
          "👤 Petugas aktif: " + nama;

      }
    );



    /* ==========================================
       LOAD RUANGAN
    ========================================== */

    function loadRuangan() {

      fetch(
        API_URL + "?action=getRuangan"
      )

      .then(function(response) {

        return response.json();

      })

      .then(function(result) {

        if (!result.berhasil) {

          throw new Error(
            result.pesan
          );

        }


        ruangan.innerHTML =
          '<option value="">Pilih Ruangan</option>';


        result.data.forEach(
          function(nama) {

            const option =
              document.createElement(
                "option"
              );


            option.value =
              nama;


            option.textContent =
              nama;


            ruangan.appendChild(
              option
            );

          }
        );

      })

      .catch(function(error) {

        console.error(
          "Gagal memuat ruangan:",
          error
        );


        ruangan.innerHTML =
          '<option value="">Gagal memuat ruangan</option>';

      });

    }



    /* ==========================================
       PILIH JENIS TRANSAKSI
    ========================================== */

    function pilihTransaksi(
      nilai,
      tombol
    ) {

      transaksiDipilih =
        nilai;


      document
        .getElementById("transaksi")
        .value =
          nilai;


      const semuaTombol =
        document.querySelectorAll(
          ".btnTransaksi"
        );


      semuaTombol.forEach(
        function(btn) {

          btn.classList.remove(
            "aktif"
          );

        }
      );


      tombol.classList.add(
        "aktif"
      );


      tampilStatus(
        "Transaksi dipilih: " + nilai,
        "info"
      );

    }



    /* ==========================================
       PILIH YA / TIDAK
    ========================================== */

    function pilihLengkap(
      nilai
    ) {

      lengkapDipilih =
        nilai;


      const btnYa =
        document.getElementById(
          "btnYa"
        );


      const btnTidak =
        document.getElementById(
          "btnTidak"
        );


      btnYa.classList.remove(
        "aktifYa"
      );


      btnTidak.classList.remove(
        "aktifTidak"
      );


      if (nilai === "YA") {

        btnYa.classList.add(
          "aktifYa"
        );

      }


      if (nilai === "TIDAK") {

        btnTidak.classList.add(
          "aktifTidak"
        );

      }

    }



    /* ==========================================
       TAMBAH RUANGAN
    ========================================== */

    function tambahRuangan() {

      const namaRuangan =
        prompt(
          "Masukkan nama ruangan baru:"
        );


      if (!namaRuangan) {

        return;

      }


      const pin =
        prompt(
          "Masukkan PIN Admin:"
        );


      if (!pin) {

        return;

      }


      const data =
        new URLSearchParams();


      data.append(
        "action",
        "tambahRuangan"
      );


      data.append(
        "pin",
        pin
      );


      data.append(
        "namaRuangan",
        namaRuangan.trim()
      );


      tampilStatus(
        "Menambahkan ruangan...",
        "proses"
      );


      fetch(
        API_URL,
        {
          method: "POST",
          body: data
        }
      )

      .then(function(response) {

        return response.json();

      })

      .then(function(result) {

        if (!result.berhasil) {

          throw new Error(
            result.pesan
          );

        }


        tampilStatus(
          "Ruangan berhasil ditambahkan.",
          "sukses"
        );


        loadRuangan();


        setTimeout(
          function() {

            ruangan.value =
              result.ruangan;

          },
          500
        );

      })

      .catch(function(error) {

        console.error(error);


        tampilStatus(
          error.message,
          "gagal"
        );

      });

    }



    /* ==========================================
       QR BERHASIL DIBACA
    ========================================== */

    function hasilScan(
      qrCodeMessage
    ) {

      if (!sedangScan) {

        return;

      }


      sedangScan =
        false;


      qrHasil =
        qrCodeMessage;


      hasilScan.innerText =
        qrCodeMessage;


      aksiScan.style.display =
        "flex";


      tampilStatus(
        "QR berhasil dibaca. Periksa data terlebih dahulu.",
        "proses"
      );


      /*
       * Pause scanner agar QR yang sama
       * tidak terbaca berkali-kali.
       */

      if (scanner) {

        try {

          scanner.pause(true);

        } catch (error) {

          console.log(error);

        }

      }

    }



    /* ==========================================
       ERROR SCAN
    ========================================== */

    function gagalScan(
      errorMessage
    ) {

      console.log(
        "Scanner:",
        errorMessage
      );

    }



    /* ==========================================
       SCAN ULANG
    ========================================== */

    function scanUlang() {

      qrHasil =
        "";


      sedangScan =
        true;


      hasilScan.innerText =
        "Menunggu QR Code...";


      aksiScan.style.display =
        "none";


      sembunyikanStatus();


      if (scanner) {

        try {

          scanner.resume();

        } catch (error) {

          console.log(error);

        }

      }

    }



    /* ==========================================
       KIRIM DATA
    ========================================== */

    function kirimData() {

      if (sedangMengirim) {

        return;

      }


      /* QR */

      if (!qrHasil) {

        alert(
          "QR Code belum terbaca."
        );

        return;

      }


      /* PETUGAS */

      if (!petugas.value) {

        alert(
          "Silakan pilih petugas."
        );

        return;

      }


      /* RUANGAN */

      if (!ruangan.value) {

        alert(
          "Silakan pilih ruangan."
        );

        return;

      }


      /* LENGKAP */

      if (
        lengkapDipilih !== "YA" &&
        lengkapDipilih !== "TIDAK"
      ) {

        alert(
          "Silakan pilih YA atau TIDAK."
        );

        return;

      }


      /* JUMLAH */

      const jumlah =
        Number(
          document.getElementById(
            "jumlah"
          ).value
        );


      if (
        !jumlah ||
        jumlah < 1
      ) {

        alert(
          "Jumlah minimal 1."
        );

        return;

      }


      /* KONFIRMASI */

      const yakin =
        confirm(
          "Kirim data QR Code ke Google Sheet?"
        );


      if (!yakin) {

        return;

      }


      sedangMengirim =
        true;


      tampilStatus(
        "Mengirim data ke Google Sheet...",
        "proses"
      );


      /* ========================================
         DATA YANG DIKIRIM
      ======================================== */

      const data =
        new URLSearchParams();


      data.append(
        "action",
        "simpanTransaksi"
      );


      data.append(
        "transaksi",
        document.getElementById(
          "transaksi"
        ).value
      );


      data.append(
        "petugas",
        petugas.value
      );


      data.append(
        "namaBarang",
        qrHasil
      );


      data.append(
        "jumlah",
        jumlah
      );


      data.append(
        "ruangan",
        ruangan.value
      );


      data.append(
        "lengkap",
        lengkapDipilih
      );


      data.append(
        "keterangan",
        document.getElementById(
          "keterangan"
        ).value.trim()
      );


      /* ========================================
         KIRIM KE GOOGLE APPS SCRIPT
      ======================================== */

      fetch(
        API_URL,
        {
          method: "POST",
          body: data
        }
      )

      .then(function(response) {

        return response.json();

      })

      .then(function(result) {

        console.log(
          "HASIL SERVER:",
          result
        );


        if (!result.berhasil) {

          throw new Error(
            result.pesan
          );

        }


        /* BERHASIL */

        tampilStatus(
          "Data berhasil disimpan ke Google Sheet.",
          "sukses"
        );


        hasilScan.innerText =
          "✅ BERHASIL DISIMPAN\n" +
          qrHasil;


        aksiScan.style.display =
          "none";


        sedangMengirim =
          false;


        /*
         * Bersihkan QR lama.
         */

        qrHasil =
          "";


        /*
         * Setelah berhasil,
         * scanner siap untuk scan berikutnya.
         */

        sedangScan =
          true;


        /*
         * Bersihkan keterangan
         */

        document.getElementById(
          "keterangan"
        ).value = "";


        /*
         * Reset YA / TIDAK
         */

        pilihLengkap("");

      })

      .catch(function(error) {

        console.error(
          "ERROR KIRIM:",
          error
        );


        tampilStatus(
          "Gagal mengirim ke Google Sheet: " +
          error.message,
          "gagal"
        );


        sedangMengirim =
          false;

      });

    }



    /* ==========================================
       STATUS
    ========================================== */

    function tampilStatus(
      pesanText,
      tipe
    ) {

      status.innerText =
        pesanText;


      status.className =
        "status " + tipe;

    }


    function sembunyikanStatus() {

      status.innerText =
        "";


      status.className =
        "status";

    }



    /* ==========================================
       MULAI SCANNER
    ========================================== */

    function mulaiScanner() {

      scanner =
        new Html5Qrcode(
          "reader"
        );


      const config = {

        fps: 10,

        qrbox: {
          width: 230,
          height: 230
        },

        aspectRatio: 1.0

      };


      scanner.start(

        {
          facingMode:
            "environment"
        },

        config,

        hasilScan,

        gagalScan

      )

      .catch(function(error) {

        console.error(
          "Kamera gagal:",
          error
        );


        hasilScan.innerText =
          "❌ Kamera tidak dapat digunakan. Pastikan izin kamera sudah diberikan.";

      });

    }



    /* ==========================================
       JALANKAN APLIKASI
    ========================================== */

    window.addEventListener(
