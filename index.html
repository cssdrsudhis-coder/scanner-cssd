<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner QR CSSD</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f8;
    }

    .header {
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 18px 10px;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 12px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 15px auto;
      padding: 0 10px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin-top: 0;
      text-align: center;
      font-size: 16px;
    }

    #reader {
      width: 100%;
    }

    .hasil {
      margin-top: 12px;
      padding: 12px;
      background: #f1f5f9;
      border-radius: 8px;
      word-break: break-word;
    }

    .hasil b {
      display: block;
      margin-bottom: 6px;
    }

    .kode {
      font-size: 17px;
      font-weight: bold;
      color: #0f172a;
    }

    .konfirmasi {
      display: none;
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      text-align: center;
    }

    .konfirmasi h3 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    .konfirmasi p {
      margin: 5px 0 15px;
      font-size: 14px;
    }

    .tombol {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-ya {
      background: #16a34a;
      color: white;
    }

    .btn-tidak {
      background: #dc2626;
      color: white;
    }

    .btn-scan {
      background: #2563eb;
      color: white;
      width: 100%;
      margin-top: 10px;
    }

    .status {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }

    .status.sukses {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .status.gagal {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .status.proses {
      display: block;
      background: #e0f2fe;
      color: #075985;
    }

    .petunjuk {
      margin-top: 12px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }

  </style>
</head>

<body>

  <div class="header">
    <h1>INSTALASI CSSD</h1>
    <p>RSUD HARAPAN INSAN SENDAWAR</p>
  </div>


  <div class="container">

    <div class="card">

      <h3>📷 SCAN QR CODE</h3>

      <div id="reader"></div>

      <div class="hasil">

        <b>Hasil Scan:</b>

        <div id="hasilScan" class="kode">
          Belum ada hasil
        </div>

      </div>


      <!-- =====================================
           KONFIRMASI
      ====================================== -->

      <div id="konfirmasi" class="konfirmasi">

        <h3>📋 Kirim Data?</h3>

        <p>
          QR Code berhasil dibaca.
          <br>
          Apakah data ini ingin dikirim ke Google Sheet?
        </p>

        <div class="tombol">

          <button
            class="btn-ya"
            onclick="kirimData()">
            ✅ YA, KIRIM
          </button>

          <button
            class="btn-tidak"
            onclick="batalKirim()">
            ❌ TIDAK
          </button>

        </div>

        <button
          class="btn-scan"
          onclick="scanUlang()">
          🔄 SCAN ULANG
        </button>

      </div>


      <!-- =====================================
           STATUS
      ====================================== -->

      <div id="status" class="status"></div>


      <div class="petunjuk">

        Scan QR → Periksa hasil → Pilih YA/TIDAK

      </div>

    </div>

  </div>


  <script>


    // ==========================================
    // GOOGLE APPS SCRIPT
    // ==========================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbw1pGmXUD9Q3v4k6ttlFlcNeiCyM25QZc7FpY_9x341B9Br2pik46FYRqqat95i6i2YAA/exec";


    // ==========================================
    // VARIABEL
    // ==========================================

    let scanner = null;

    let qrHasil = "";

    let sedangScan = false;

    let sedangMengirim = false;


    // ==========================================
    // ELEMENT
    // ==========================================

    const hasilScan =
      document.getElementById("hasilScan");

    const konfirmasi =
      document.getElementById("konfirmasi");

    const status =
      document.getElementById("status");


    // ==========================================
    // MEMULAI SCANNER
    // ==========================================

    function mulaiScanner() {

      qrHasil = "";

      hasilScan.innerText =
        "Menunggu QR Code...";

      konfirmasi.style.display =
        "none";

      status.className =
        "status";

      scanner =
        new Html5Qrcode("reader");

      sedangScan = true;

      scanner.start(

        {
          facingMode: "environment"
        },

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }

        },

        berhasilScan,

        gagalScan

      ).catch(function(error) {

        console.error(
          "Kamera gagal:",
          error
        );

        hasilScan.innerText =
          "❌ Kamera tidak dapat digunakan.";

      });

    }


    // ==========================================
    // QR BERHASIL DIBACA
    // ==========================================

    async function berhasilScan(qrCodeMessage) {

      if (!sedangScan) {
        return;
      }

      sedangScan = false;

      qrHasil =
        String(qrCodeMessage).trim();


      console.log(
        "QR TERBACA:",
        qrHasil
      );


      // Hentikan kamera

      try {

        await scanner.stop();

        await scanner.clear();

      } catch (error) {

        console.log(
          "Scanner sudah berhenti."
        );

      }


      // Tampilkan hasil

      hasilScan.innerText =
        qrHasil;


      // Tampilkan pertanyaan

      konfirmasi.style.display =
        "block";

    }


    // ==========================================
    // ERROR SCAN
    // ==========================================

    function gagalScan(errorMessage) {

      console.log(
        "Scanner:",
        errorMessage
      );

    }


    // ==========================================
    // TOMBOL YA
    // ==========================================

    function kirimData() {

      if (!qrHasil) {

        alert(
          "Belum ada QR Code yang terbaca."
        );

        return;

      }

      if (sedangMengirim) {
        return;
      }

      sedangMengirim = true;


      konfirmasi.style.display =
        "none";


      status.className =
        "status proses";

      status.innerText =
        "⏳ Mengirim data ke Google Sheet...";


      // ======================================
      // DATA TRANSAKSI
      // ======================================

      const data =
        new URLSearchParams();


      data.append(
        "action",
        "simpanTransaksi"
      );


      data.append(
        "transaksi",
        "BARANG MASUK"
      );


      data.append(
        "petugas",
        "TEST"
      );


      data.append(
        "namaBarang",
        qrHasil
      );


      data.append(
        "jumlah",
        "1"
      );


      data.append(
        "ruangan",
        "TEST"
      );


      data.append(
        "lengkap",
        "YA"
      );


      data.append(
        "keterangan",
        "SCAN QR"
      );


      // ======================================
      // KIRIM KE GOOGLE APPS SCRIPT
      // ======================================

      fetch(
        API_URL,
        {
          method: "POST",
          body: data
        }
      )

      .then(function(response) {

        return response.json();

      })

      .then(function(result) {

        console.log(
          "HASIL SERVER:",
          result
        );


        if (result.berhasil) {

          status.className =
            "status sukses";

          status.innerText =
            "✅ DATA BERHASIL DISIMPAN KE GOOGLE SHEET";


          hasilScan.innerText =
            qrHasil;


          setTimeout(
            function() {

              sedangMengirim =
                false;

              scanUlang();

            },
            2000
          );


        } else {

          status.className =
            "status gagal";

          status.innerText =
            "❌ GAGAL: " +
            result.pesan;


          sedangMengirim =
            false;

        }

      })

      .catch(function(error) {

        console.error(
          "ERROR:",
          error
        );


        status.className =
          "status gagal";

        status.innerText =
          "❌ GAGAL TERHUBUNG KE GOOGLE SHEET";


        sedangMengirim =
          false;

      });

    }


    // ==========================================
    // TOMBOL TIDAK
    // ==========================================

    function batalKirim() {

      konfirmasi.style.display =
        "none";


      status.className =
        "status gagal";

      status.innerText =
        "❌ Data tidak dikirim.";


      qrHasil = "";


      hasilScan.innerText =
        "Silakan scan QR kembali.";


      setTimeout(
        function() {

          scanUlang();

        },
        1000
      );

    }


    // ==========================================
    // SCAN ULANG
    // ==========================================

    function scanUlang() {

      if (scanner) {

        try {

          scanner.stop();

        } catch (error) {

          console.log(error);

        }

      }


      scanner = null;

      qrHasil = "";

      sedangScan = false;


      hasilScan.innerText =
        "Menyiapkan kamera...";


      konfirmasi.style.display =
        "none";


      status.className =
        "status";


      setTimeout(
        function() {

          mulaiScanner();

        },
        300
      );

    }


    // ==========================================
    // MULAI OTOMATIS
    // ==========================================

    mulaiScanner();


  </script>

</body>
</html>
