<html lang="id">

</title>

<style>

/* =========================================================
   CSSD DIGITAL SYSTEM
   FINAL UI
========================================================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color:#F8FAFC;

  background:
    radial-gradient(
      circle at 50% -10%,
      #18283A 0%,
      #0B1117 35%,
      #050709 75%
    );

  -webkit-font-smoothing:antialiased;
}


/* =========================================================
   VARIABLE
========================================================= */

:root{

  --bg:#050709;

  --panel:#0D1318;

  --panel2:#121A21;

  --panel3:#17212A;

  --border:#263440;

  --border-light:#344452;

  --white:#F8FAFC;

  --muted:#94A3B8;

  --blue:#3B82F6;

  --blue-light:#60A5FA;

  --green:#22C55E;

  --green-light:#4ADE80;

  --yellow:#F59E0B;

  --yellow-light:#FBBF24;

  --red:#EF4444;

  --red-light:#F87171;

}


/* =========================================================
   HEADER
========================================================= */

.header{

  position:relative;

  padding:
    24px
    16px
    22px;

  text-align:center;

  background:
    linear-gradient(
      145deg,
      #101B27,
      #080D12
    );

  border-bottom:
    1px solid
    rgba(96,165,250,.16);

  box-shadow:
    0 12px 40px
    rgba(0,0,0,.35);

}


.header::after{

  content:"";

  position:absolute;

  left:18%;
  right:18%;
  bottom:-1px;

  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(59,130,246,.7),
      transparent
    );

}


.greeting{

  font-size:21px;

  font-weight:900;

  letter-spacing:.2px;

  color:#FFFFFF;

  margin-bottom:7px;

}


.header-title{

  font-size:19px;

  font-weight:900;

  letter-spacing:1px;

}


.header-subtitle{

  margin-top:6px;

  font-size:11px;

  font-weight:700;

  letter-spacing:.8px;

  color:
    var(--blue-light);

}


.header-message{

  margin-top:10px;

  font-size:11px;

  line-height:1.7;

  color:#CBD5E1;

}


/* =========================================================
   CONTAINER
========================================================= */

.container{

  width:100%;

  max-width:540px;

  margin:0 auto;

  padding:
    15px
    10px
    25px;

}


/* =========================================================
   CARD
========================================================= */

.card{

  position:relative;

  margin-bottom:13px;

  padding:16px;

  border:
    1px solid
    var(--border);

  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      rgba(18,26,33,.98),
      rgba(9,13,17,.98)
    );

  box-shadow:
    0 12px 35px
    rgba(0,0,0,.25);

}


.card-title{

  display:flex;

  align-items:center;

  gap:8px;

  margin-bottom:14px;

  font-size:14px;

  font-weight:900;

  letter-spacing:.5px;

}


.card-title span{

  color:
    var(--blue-light);

}


/* =========================================================
   NOTIFICATION
========================================================= */

.notifikasi{

  display:none;

  margin-bottom:13px;

  padding:13px 14px;

  border-radius:13px;

  font-size:12px;

  font-weight:800;

  line-height:1.55;

  white-space:pre-line;

}


.notifikasi.show{

  display:block;

}


.notifikasi.info{

  color:#93C5FD;

  background:
    rgba(59,130,246,.10);

  border:
    1px solid
    rgba(59,130,246,.30);

}


.notifikasi.sukses{

  color:#86EFAC;

  background:
    rgba(34,197,94,.10);

  border:
    1px solid
    rgba(34,197,94,.30);

}


.notifikasi.gagal{

  color:#FCA5A5;

  background:
    rgba(239,68,68,.10);

  border:
    1px solid
    rgba(239,68,68,.30);

}


/* =========================================================
   SCANNER
========================================================= */

.scanner-card{

  padding-bottom:14px;

}


.scanner-frame{

  position:relative;

  padding:8px;

  border:
    1px solid
    rgba(96,165,250,.22);

  border-radius:17px;

  background:#030506;

  box-shadow:
    inset 0 0 25px
    rgba(0,0,0,.65);

}


#reader{

  width:100%;

  max-width:360px;

  margin:0 auto;

  overflow:hidden;

  border-radius:12px;

}


#reader video{

  width:100%!important;

  border-radius:12px;

}


#reader img{

  max-width:100%;

}


.scan-status{

  margin-top:11px;

  padding:11px;

  text-align:center;

  border-radius:11px;

  background:
    #0A1015;

  border:
    1px solid
    var(--border);

  color:#CBD5E1;

  font-size:12px;

  font-weight:800;

  line-height:1.5;

}


.hasil-scan{

  margin-top:10px;

  padding:13px;

  border-radius:12px;

  background:
    rgba(59,130,246,.08);

  border:
    1px solid
    rgba(59,130,246,.28);

}


.hasil-label{

  margin-bottom:5px;

  color:
    var(--muted);

  font-size:9px;

  font-weight:900;

  letter-spacing:.8px;

}


#hasilScan{

  color:
    var(--blue-light);

  font-size:15px;

  font-weight:900;

  line-height:1.4;

  word-break:break-word;

}


.btn-scan-ulang{

  margin-top:9px;

  background:
    #151D24;

  border:
    1px solid
    #334250;

  color:#CBD5E1;

}


/* =========================================================
   TRANSAKSI
========================================================= */

.transaksi-grid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:8px;

}


.btn-transaksi{

  min-height:72px;

  padding:10px 6px;

  background:
    #0A1015;

  border:
    1px solid
    var(--border);

  color:#94A3B8;

  font-size:11px;

  line-height:1.35;

}


.btn-transaksi::first-line{

  font-weight:900;

}


.btn-transaksi.masuk.aktif{

  color:
    #93C5FD;

  border-color:
    rgba(59,130,246,.75);

  background:
    linear-gradient(
      145deg,
      rgba(59,130,246,.18),
      rgba(59,130,246,.06)
    );

  box-shadow:
    0 0 20px
    rgba(59,130,246,.08);

}


.btn-transaksi.steril.aktif{

  color:
    #86EFAC;

  border-color:
    rgba(34,197,94,.75);

  background:
    linear-gradient(
      145deg,
      rgba(34,197,94,.17),
      rgba(34,197,94,.05)
    );

}


.btn-transaksi.keluar.aktif{

  color:
    #FCD34D;

  border-color:
    rgba(245,158,11,.75);

  background:
    linear-gradient(
      145deg,
      rgba(245,158,11,.17),
      rgba(245,158,11,.05)
    );

}


/* =========================================================
   FORM
========================================================= */

.field{

  margin-bottom:14px;

}


label{

  display:block;

  margin-bottom:6px;

  color:#CBD5E1;

  font-size:10px;

  font-weight:900;

  letter-spacing:.7px;

  text-transform:uppercase;

}


select,
input,
textarea{

  width:100%;

  padding:12px;

  color:#F8FAFC;

  background:
    #080D11;

  border:
    1px solid
    var(--border);

  border-radius:11px;

  outline:none;

  font-size:13px;

  transition:
    .18s ease;

}


select:focus,
input:focus,
textarea:focus{

  border-color:
    rgba(59,130,246,.75);

  box-shadow:
    0 0 0 3px
    rgba(59,130,246,.08);

}


select{

  cursor:pointer;

}


option{

  color:#FFFFFF;

  background:#10161C;

}


textarea{

  min-height:88px;

  resize:vertical;

  line-height:1.5;

}


textarea::placeholder,
input::placeholder{

  color:#64748B;

}


/* =========================================================
   TAMBAH RUANGAN
========================================================= */

.btn-tambah-ruangan{

  margin-top:7px;

  min-height:40px;

  background:
    #111920;

  border:
    1px solid
    #334250;

  color:#CBD5E1;

  font-size:11px;

}


/* =========================================================
   JUMLAH
========================================================= */

.jumlah-control{

  display:grid;

  grid-template-columns:
    54px
    1fr
    54px;

  gap:7px;

}


.jumlah-btn{

  height:47px;

  padding:0;

  background:
    #141C23;

  border:
    1px solid
    #334250;

  color:#FFFFFF;

  font-size:24px;

  line-height:1;

}


#jumlah{

  height:47px;

  padding:0 10px;

  text-align:center;

  font-size:18px;

  font-weight:900;

}


/* =========================================================
   KONDISI
========================================================= */

.kondisi-grid{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:8px;

}


.btn-kondisi{

  min-height:47px;

  background:
    #0A1015;

  border:
    1px solid
    var(--border);

  color:#CBD5E1;

  font-size:12px;

}


.btn-kondisi.lengkap.aktif{

  color:#86EFAC;

  border-color:
    rgba(34,197,94,.8);

  background:
    rgba(34,197,94,.13);

}


.btn-kondisi.tidak.aktif{

  color:#FCA5A5;

  border-color:
    rgba(239,68,68,.8);

  background:
    rgba(239,68,68,.13);

}


/* =========================================================
   KIRIM
========================================================= */

.btn-kirim{

  min-height:54px;

  margin-top:3px;

  background:
    linear-gradient(
      135deg,
      #15803D,
      #22C55E
    );

  color:#FFFFFF;

  border:0;

  font-size:14px;

  letter-spacing:.2px;

  box-shadow:
    0 8px 22px
    rgba(34,197,94,.16);

}


.btn-kirim:disabled{

  background:
    #26312B;

  color:
    #6B7280;

  box-shadow:none;

}


/* =========================================================
   MODAL
========================================================= */

.modal{

  display:none;

  position:fixed;

  inset:0;

  z-index:9999;

  align-items:center;

  justify-content:center;

  padding:18px;

  background:
    rgba(0,0,0,.80);

  backdrop-filter:
    blur(5px);

}


.modal.show{

  display:flex;

}


.modal-box{

  width:100%;

  max-width:400px;

  padding:18px;

  border:
    1px solid
    var(--border-light);

  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      #141C23,
      #0A0F13
    );

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.55);

}


.modal-title{

  margin-bottom:16px;

  text-align:center;

  font-size:16px;

  font-weight:900;

}


.modal-grid{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:8px;

}


.btn-simpan-ruangan{

  background:
    var(--green);

  color:#FFFFFF;

}


.btn-tutup{

  background:
    #374151;

  color:#FFFFFF;

}


/* =========================================================
   FOOTER
========================================================= */

.footer{

  padding:
    16px
    8px
    30px;

  text-align:center;

  color:#64748B;

  font-size:11px;

  line-height:1.8;

}


.footer-name{

  margin-top:9px;

  color:
    var(--blue-light);

  font-size:12px;

  font-weight:900;

  letter-spacing:1px;

}


/* =========================================================
   HIDDEN
========================================================= */

.hidden{

  display:none!important;

}


/* =========================================================
   BUTTON GLOBAL
========================================================= */

button{

  width:100%;

  min-height:44px;

  padding:10px;

  border-radius:10px;

  cursor:pointer;

  font-family:inherit;

  font-weight:900;

  transition:
    transform .12s ease,
    opacity .15s ease,
    border-color .15s ease;

}


button:active{

  transform:scale(.98);

}


button:disabled{

  opacity:.45;

  cursor:not-allowed;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:380px){

  .container{

    padding-left:7px;
    padding-right:7px;

  }


  .card{

    padding:13px;

  }


  .transaksi-grid{

    gap:6px;

  }


  .btn-transaksi{

    min-height:68px;

    font-size:10px;

  }

}


</style>

</head>

<script>

/* =========================================================
   GOOGLE APPS SCRIPT
========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbw1pGmXUD9Q3v4k6ttlFlcNeiCyM25QZc7FpY_9x341B9Br2pik46FYRqqat95i6i2YAA/exec";


/* =========================================================
   VARIABEL
========================================================= */

let scanner =
  new Html5Qrcode("reader");

let sedangScan =
  false;

let sedangMengirim =
  false;

let qrHasil =
  "";

let lengkapDipilih =
  "";

let transaksiDipilih =
  "BARANG MASUK";


/* =========================================================
   HELPER
========================================================= */

function $(id){

  return document.getElementById(id);

}


/* =========================================================
   SAPAAN
========================================================= */

function aturSapaan(){

  const jam =
    new Date().getHours();

  let sapaan =
    "Selamat malam";

  if(
    jam >= 5 &&
    jam < 11
  ){

    sapaan =
      "Selamat pagi";

  }
  else if(
    jam >= 11 &&
    jam < 15
  ){

    sapaan =
      "Selamat siang";

  }
  else if(
    jam >= 15 &&
    jam < 19
  ){

    sapaan =
      "Selamat sore";

  }

  $("greeting").innerText =
    sapaan;

}


/* =========================================================
   NOTIFIKASI
========================================================= */

function tampilNotifikasi(
  pesan,
  tipe
){

  const box =
    $("notifikasi");

  box.className =
    "notifikasi show " + tipe;

  box.innerText =
    pesan;

}


function hapusNotifikasi(){

  $("notifikasi").className =
    "notifikasi";

  $("notifikasi").innerText =
    "";

}


/* =========================================================
   LOAD MASTER
========================================================= */

async function loadMaster(){

  try{

    $("petugas").innerHTML =
      '<option value="">Memuat petugas...</option>';

    $("ruangan").innerHTML =
      '<option value="">Memuat ruangan...</option>';


    const response =
      await fetch(
        API_URL +
        "?action=getMaster&_=" +
        Date.now(),
        {
          method:"GET",
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "Server HTTP " +
        response.status
      );

    }


    const result =
      await response.json();


    if(!result.berhasil){

      throw new Error(
        result.pesan ||
        "Gagal memuat master."
      );

    }


    /* PETUGAS */

    $("petugas").innerHTML =
      '<option value="">Pilih Petugas</option>';


    (
      result.petugas || []
    ).forEach(
      function(nama){

        if(!nama) return;

        const option =
          document.createElement(
            "option"
          );

        option.value =
          nama;

        option.textContent =
          nama;

        $("petugas")
          .appendChild(option);

      }
    );


    /* RUANGAN */

    $("ruangan").innerHTML =
      '<option value="">Pilih Ruangan</option>';


    (
      result.ruangan || []
    ).forEach(
      function(nama){

        if(!nama) return;

        const option =
          document.createElement(
            "option"
          );

        option.value =
          nama;

        option.textContent =
          nama;

        $("ruangan")
          .appendChild(option);

      }
    );


    if(
      !result.petugas ||
      result.petugas.length === 0
    ){

      tampilNotifikasi(
        "Data petugas masih kosong.",
        "info"
      );

    }


  }
  catch(error){

    console.error(
      "LOAD MASTER:",
      error
    );


    $("petugas").innerHTML =
      '<option value="">Gagal memuat petugas</option>';

    $("ruangan").innerHTML =
      '<option value="">Gagal memuat ruangan</option>';


    tampilNotifikasi(
      "GAGAL MEMUAT PETUGAS / RUANGAN\n" +
      error.message,
      "gagal"
    );

  }

}


/* =========================================================
   TRANSAKSI
========================================================= */

function pilihTransaksi(
  nilai
){

  transaksiDipilih =
    nilai;

  $("transaksi").value =
    nilai;


  document
    .querySelectorAll(
      ".btn-transaksi"
    )
    .forEach(
      function(button){

        button.classList
          .remove("aktif");

      }
    );


  if(
    nilai ===
    "BARANG MASUK"
  ){

    $("transaksiMasuk")
      .classList
      .add("aktif");

  }


  if(
    nilai ===
    "PROSES STERIL"
  ){

    $("transaksiSteril")
      .classList
      .add("aktif");

  }


  if(
    nilai ===
    "BARANG KELUAR"
  ){

    $("transaksiKeluar")
      .classList
      .add("aktif");

  }

}


$("transaksiMasuk")
  .addEventListener(
    "click",
    function(){

      pilihTransaksi(
        "BARANG MASUK"
      );

    }
  );


$("transaksiSteril")
  .addEventListener(
    "click",
    function(){

      pilihTransaksi(
        "PROSES STERIL"
      );

    }
  );


$("transaksiKeluar")
  .addEventListener(
    "click",
    function(){

      pilihTransaksi(
        "BARANG KELUAR"
      );

    }
  );


/* =========================================================
   JUMLAH
========================================================= */

function ambilJumlah(){

  let jumlah =
    Number(
      $("jumlah").value
    );


  if(
    !jumlah ||
    jumlah < 1
  ){

    jumlah = 1;

  }


  return jumlah;

}


$("btnTambah")
  .addEventListener(
    "click",
    function(){

      $("jumlah").value =
        ambilJumlah() + 1;

    }
  );


$("btnKurang")
  .addEventListener(
    "click",
    function(){

      const jumlah =
        ambilJumlah();


      if(jumlah > 1){

        $("jumlah").value =
          jumlah - 1;

      }

    }
  );


/* =========================================================
   KONDISI
========================================================= */

function pilihKondisi(
  nilai
){

  lengkapDipilih =
    nilai;

  $("lengkap").value =
    nilai;


  $("btnLengkap")
    .classList
    .remove("aktif");


  $("btnTidakLengkap")
    .classList
    .remove("aktif");


  if(
    nilai === "YA"
  ){

    $("btnLengkap")
      .classList
      .add("aktif");

  }


  if(
    nilai === "TIDAK"
  ){

    $("btnTidakLengkap")
      .classList
      .add("aktif");

  }


  periksaKesiapanKirim();

}


$("btnLengkap")
  .addEventListener(
    "click",
    function(){

      pilihKondisi("YA");

    }
  );


$("btnTidakLengkap")
  .addEventListener(
    "click",
    function(){

      pilihKondisi("TIDAK");

    }
  );


/* =========================================================
   CEK KESIAPAN
========================================================= */

function periksaKesiapanKirim(){

  $("btnKirim").disabled =
    !(
      qrHasil &&
      lengkapDipilih
    );

}


/* =========================================================
   SCANNER
========================================================= */

async function mulaiScanner(){

  if(sedangScan)
    return;


  sedangScan =
    true;


  $("status").innerText =
    "📷 Arahkan kamera ke QR Code...";


  try{

    await scanner.start(

      {
        facingMode:
          "environment"
      },

      {
        fps:10,

        qrbox:{
          width:210,
          height:210
        },

        aspectRatio:1.0

      },

      berhasilScan,

      function(){}

    );


    $("status").innerText =
      "📷 Kamera aktif. Siap scan QR Code.";

  }
  catch(error){

    console.error(
      "KAMERA:",
      error
    );


    sedangScan =
      false;


    $("status").innerText =
      "❌ Kamera tidak dapat digunakan.";


    tampilNotifikasi(
      "Kamera tidak dapat digunakan.\n" +
      "Pastikan izin kamera diberikan.",
      "gagal"
    );

  }

}


/* =========================================================
   STOP SCANNER
========================================================= */

async function berhentiScanner(){

  if(!sedangScan)
    return;


  try{

    await scanner.stop();

  }
  catch(error){

    console.log(
      "Scanner stop:",
      error
    );

  }


  sedangScan =
    false;

}


/* =========================================================
   HASIL SCAN
========================================================= */

async function berhasilScan(
  decodedText
){

  if(
    qrHasil ||
    sedangMengirim
  ){

    return;

  }


  qrHasil =
    String(
      decodedText
    ).trim();


  if(!qrHasil)
    return;


  await berhentiScanner();


  $("hasilScan").innerText =
    qrHasil;


  $("hasilBox")
    .classList
    .remove("hidden");


  $("btnScanUlang")
    .classList
    .remove("hidden");


  $("status").innerText =
    "✅ QR berhasil dibaca. Periksa data.";


  tampilNotifikasi(
    "QR BERHASIL TERBACA\n\n" +
    qrHasil +
    "\n\nJika salah, tekan SCAN ULANG.",
    "info"
  );


  periksaKesiapanKirim();

}


/* =========================================================
   SCAN ULANG
========================================================= */

$("btnScanUlang")
  .addEventListener(
    "click",
    async function(){

      await resetUntukScan();

    }
  );


async function resetUntukScan(){

  await berhentiScanner();


  qrHasil =
    "";

  lengkapDipilih =
    "";


  $("hasilScan").innerText =
    "";


  $("hasilBox")
    .classList
    .add("hidden");


  $("btnScanUlang")
    .classList
    .add("hidden");


  $("lengkap").value =
    "";


  $("btnLengkap")
    .classList
    .remove("aktif");


  $("btnTidakLengkap")
    .classList
    .remove("aktif");


  $("keterangan").value =
    "";


  $("jumlah").value =
    1;


  $("btnKirim").disabled =
    true;


  hapusNotifikasi();


  $("status").innerText =
    "Menyiapkan kamera...";


  await mulaiScanner();

}


/* =========================================================
   KIRIM DATA
========================================================= */

$("btnKirim")
  .addEventListener(
    "click",
    async function(){

      if(sedangMengirim)
        return;


      const petugas =
        $("petugas").value;

      const transaksi =
        $("transaksi").value;

      const jumlah =
        Number(
          $("jumlah").value
        );

      const ruangan =
        $("ruangan").value;

      const keterangan =
        $("keterangan")
          .value
          .trim();


      if(!qrHasil){

        tampilNotifikasi(
          "QR Code belum dipindai.",
          "gagal"
        );

        return;

      }


      if(!petugas){

        tampilNotifikasi(
          "Silakan pilih petugas.",
          "gagal"
        );

        return;

      }


      if(!ruangan){

        tampilNotifikasi(
          "Silakan pilih ruangan.",
          "gagal"
        );

        return;

      }


      if(
        !jumlah ||
        jumlah < 1
      ){

        tampilNotifikasi(
          "Jumlah minimal 1.",
          "gagal"
        );

        return;

      }


      if(
        lengkapDipilih !== "YA" &&
        lengkapDipilih !== "TIDAK"
      ){

        tampilNotifikasi(
          "Silakan pilih LENGKAP atau TIDAK LENGKAP.",
          "gagal"
        );

        return;

      }


      sedangMengirim =
        true;


      $("btnKirim").disabled =
        true;


      tampilNotifikasi(
        "⏳ SEDANG MENGIRIM DATA...",
        "info"
      );


      const data =
        new URLSearchParams();


      data.append(
        "action",
        "simpanTransaksi"
      );


      data.append(
        "transaksi",
        transaksi
      );


      data.append(
        "petugas",
        petugas
      );


      data.append(
        "namaBarang",
        qrHasil
      );


      data.append(
        "jumlah",
        String(jumlah)
      );


      data.append(
        "ruangan",
        ruangan
      );


      data.append(
        "lengkap",
        lengkapDipilih
      );


      data.append(
        "keterangan",
        keterangan
      );


      try{

        const response =
          await fetch(
            API_URL,
            {
              method:"POST",
              body:data,
              cache:"no-store"
            }
          );


        const result =
          await response.json();


        if(
          !result.berhasil
        ){

          throw new Error(
            result.pesan ||
            "Data gagal disimpan."
          );

        }


        tampilNotifikasi(
          "✅ BARANG TERKIRIM\n\n" +
          "Data berhasil masuk ke Google Sheet.\n\n" +
          "Nomor: " +
          (
            result.nomor ||
            "-"
          ),
          "sukses"
        );


        $("status").innerText =
          "✅ DATA BERHASIL TERKIRIM";


        sedangMengirim =
          false;


        qrHasil =
          "";

        lengkapDipilih =
          "";


        $("hasilScan").innerText =
          "";


        $("hasilBox")
          .classList
          .add("hidden");


        $("btnScanUlang")
          .classList
          .add("hidden");


        $("lengkap").value =
          "";


        $("btnLengkap")
          .classList
          .remove("aktif");


        $("btnTidakLengkap")
          .classList
          .remove("aktif");


        $("keterangan").value =
          "";


        $("jumlah").value =
          1;


        $("btnKirim").disabled =
          true;


        setTimeout(
          async function(){

            hapusNotifikasi();

            await mulaiScanner();

          },
          1300
        );


      }
      catch(error){

        console.error(
          "KIRIM:",
          error
        );


        sedangMengirim =
          false;


        $("btnKirim").disabled =
          false;


        tampilNotifikasi(
          "❌ GAGAL MENGIRIM DATA\n\n" +
          error.message +
          "\n\nData belum tersimpan.",
          "gagal"
        );

      }

    }
  );


/* =========================================================
   TAMBAH RUANGAN
========================================================= */

$("btnTambahRuangan")
  .addEventListener(
    "click",
    function(){

      $("pinAdmin").value =
        "";

      $("namaRuangan").value =
        "";


      $("modalRuangan")
        .classList
        .add("show");

    }
  );


$("btnTutupRuangan")
  .addEventListener(
    "click",
    function(){

      $("modalRuangan")
        .classList
        .remove("show");

    }
  );


/* =========================================================
   SIMPAN RUANGAN
========================================================= */

$("btnSimpanRuangan")
  .addEventListener(
    "click",
    async function(){

      const pin =
        $("pinAdmin")
          .value
          .trim();


      const namaRuangan =
        $("namaRuangan")
          .value
          .trim();


      if(!pin){

        alert(
          "PIN Admin belum diisi."
        );

        return;

      }


      if(!namaRuangan){

        alert(
          "Nama ruangan belum diisi."
        );

        return;

      }


      this.disabled =
        true;


      this.innerText =
        "MENYIMPAN...";


      const data =
        new URLSearchParams();


      data.append(
        "action",
        "tambahRuangan"
      );


      data.append(
        "pin",
        pin
      );


      data.append(
        "namaRuangan",
        namaRuangan
      );


      try{

        const response =
          await fetch(
            API_URL,
            {
              method:"POST",
              body:data,
              cache:"no-store"
            }
          );


        const result =
          await response.json();


        if(
          !result.berhasil
        ){

          throw new Error(
            result.pesan ||
            "Gagal menambah ruangan."
          );

        }


        $("modalRuangan")
          .classList
          .remove("show");


        tampilNotifikasi(
          "✅ RUANGAN BERHASIL DITAMBAHKAN\n\n" +
          result.ruangan,
          "sukses"
        );


        await loadMaster();


        $("ruangan").value =
          result.ruangan;

      }
      catch(error){

        tampilNotifikasi(
          "❌ GAGAL MENAMBAH RUANGAN\n\n" +
          error.message,
          "gagal"
        );

      }


      this.disabled =
        false;


      this.innerText =
        "SIMPAN";

    }
  );


/* =========================================================
   MODAL
========================================================= */

$("modalRuangan")
  .addEventListener(
    "click",
    function(event){

      if(
        event.target === this
      ){

        this.classList
          .remove("show");

      }

    }
  );


/* =========================================================
   START SYSTEM
========================================================= */

aturSapaan();

loadMaster();

mulaiScanner();

</script>
