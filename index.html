<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Scanner QR CSSD</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f8;
      color: #172033;
    }

    .header {
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 18px 10px;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 12px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
      padding: 0 10px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin-top: 0;
      text-align: center;
      font-size: 17px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 13px;
      margin-top: 12px;
      margin-bottom: 6px;
    }

    select,
    input,
    button {
      width: 100%;
      min-height: 44px;
      border-radius: 8px;
      font-size: 14px;
    }

    select,
    input {
      border: 1px solid #cbd5e1;
      padding: 10px;
      background: white;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-tambah {
      margin-top: 8px;
      background: #64748b;
      color: white;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
    }

    .hasil {
      margin-top: 12px;
      padding: 12px;
      background: #f1f5f9;
      border-radius: 8px;
      word-break: break-word;
    }

    .qr-text {
      margin-top: 6px;
      font-weight: bold;
      color: #0f172a;
    }

    .konfirmasi {
      display: none;
      margin-top: 15px;
      padding: 15px;
      background: #fff7ed;
      border-radius: 12px;
      border: 1px solid #fed7aa;
    }

    .konfirmasi h3 {
      margin: 0 0 8px;
      text-align: center;
    }

    .pertanyaan {
      text-align: center;
      margin: 8px 0 15px;
      font-weight: bold;
    }

    .tombol-konfirmasi {
      display: flex;
      gap: 10px;
    }

    .btn-ya {
      background: #16a34a;
      color: white;
    }

    .btn-tidak {
      background: #dc2626;
      color: white;
    }

    .status {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }

    .status.proses {
      display: block;
      background: #e0f2fe;
      color: #0369a1;
    }

    .status.berhasil {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .status.gagal {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 14px;
      padding: 20px;
    }

    .modal-box h3 {
      margin-top: 0;
      text-align: center;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-simpan {
      background: #2563eb;
      color: white;
    }

    .btn-batal {
      background: #e5e7eb;
      color: #111827;
    }

    .info {
      font-size: 12px;
      color: #64748b;
      text-align: center;
      margin-top: 8px;
    }

  </style>

</head>

<body>


  <!-- ==========================================
       HEADER
       ========================================== -->

  <div class="header">

    <h1>INSTALASI CSSD</h1>

    <p>
      RSUD HARAPAN INSAN SENDAWAR
    </p>

  </div>


  <div class="container">


    <!-- ==========================================
         DATA TRANSAKSI
         ========================================== -->

    <div class="card">

      <h3>📋 DATA TRANSAKSI</h3>


      <label>
        Jenis Transaksi
      </label>

      <select id="transaksi">

        <option value="BARANG MASUK">
          BARANG MASUK
        </option>

        <option value="PROSES STERIL">
          PROSES STERIL
        </option>

        <option value="BARANG KELUAR">
          BARANG KELUAR
        </option>

      </select>


      <label>
        Petugas
      </label>

      <select id="petugas">

        <option value="">
          Memuat petugas...
        </option>

      </select>


      <label>
        Ruangan
      </label>

      <select id="ruangan">

        <option value="">
          Memuat ruangan...
        </option>

      </select>


      <button
        class="btn-tambah"
        onclick="bukaTambahRuangan()"
      >
        ➕ Tambah Ruangan
      </button>


      <label>
        Jumlah
      </label>

      <input
        id="jumlah"
        type="number"
        min="1"
        value="1"
      >


    </div>


    <!-- ==========================================
         SCANNER
         ========================================== -->

    <div class="card">

      <h3>
        📷 SCAN QR CODE
      </h3>


      <div id="reader"></div>


      <div class="hasil">

        <b>
          Hasil Scan:
        </b>

        <div
          id="hasilScan"
          class="qr-text"
        >
          Belum ada hasil scan
        </div>

      </div>


      <!-- ========================================
           KONFIRMASI YA / TIDAK
           ======================================== -->

      <div
        id="konfirmasi"
        class="konfirmasi"
      >

        <h3>
          ⚠️ KONFIRMASI
        </h3>


        <div class="pertanyaan">

          Apakah instrumen / set
          dalam kondisi lengkap?

        </div>


        <div class="tombol-konfirmasi">

          <button
            class="btn-ya"
            onclick="konfirmasiLengkap('YA')"
          >
            ✅ YA
          </button>

          <button
            class="btn-tidak"
            onclick="konfirmasiLengkap('TIDAK')"
          >
            ❌ TIDAK
          </button>

        </div>

      </div>


      <!-- ========================================
           STATUS
           ======================================== -->

      <div
        id="status"
        class="status"
      ></div>


      <div class="info">

        Scan QR → Konfirmasi YA/TIDAK
        → Data dikirim ke Google Sheet

      </div>

    </div>


  </div>


  <!-- ==========================================
       MODAL TAMBAH RUANGAN
       ========================================== -->

  <div
    id="modalRuangan"
    class="modal"
  >

    <div class="modal-box">

      <h3>
        ➕ Tambah Ruangan
      </h3>


      <label>
        Nama Ruangan
      </label>

      <input
        id="namaRuangan"
        type="text"
        placeholder="Contoh: IBS"
      >


      <label>
        PIN Admin
      </label>

      <input
        id="pinAdmin"
        type="password"
        inputmode="numeric"
        placeholder="Masukkan PIN"
      >


      <div class="modal-buttons">

        <button
          class="btn-batal"
          onclick="tutupTambahRuangan()"
        >
          Batal
        </button>

        <button
          class="btn-simpan"
          onclick="simpanRuangan()"
        >
          Simpan
        </button>

      </div>

    </div>

  </div>


  <script>


    // =================================================
    // GOOGLE APPS SCRIPT
    // =================================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbw1pGmXUD9Q3v4k6ttlFlcNeiCyM25QZc7FpY_9x341B9Br2pik46FYRqqat95i6i2YAA/exec";


    // =================================================
    // VARIABEL SCANNER
    // =================================================

    let scanner = null;

    let sedangScan = false;

    let sedangMengirim = false;

    let qrHasil = "";


    // =================================================
    // AMBIL PETUGAS
    // =================================================

    async function loadPetugas() {

      const select =
        document.getElementById("petugas");

      try {

        const response =
          await fetch(
            API_URL +
            "?action=getPetugas"
          );

        const result =
          await response.json();


        select.innerHTML =
          '<option value="">Pilih petugas</option>';


        if (
          result.berhasil &&
          Array.isArray(result.data)
        ) {

          result.data.forEach(
            nama => {

              const option =
                document.createElement(
                  "option"
                );

              option.value = nama;

              option.textContent = nama;

              select.appendChild(
                option
              );

            }
          );

        }

      } catch (error) {

        console.error(
          "Gagal mengambil petugas:",
          error
        );

        select.innerHTML =
          '<option value="">Gagal memuat petugas</option>';

      }

    }


    // =================================================
    // AMBIL RUANGAN
    // =================================================

    async function loadRuangan() {

      const select =
        document.getElementById("ruangan");

      try {

        const response =
          await fetch(
            API_URL +
            "?action=getRuangan"
          );

        const result =
          await response.json();


        select.innerHTML =
          '<option value="">Pilih ruangan</option>';


        if (
          result.berhasil &&
          Array.isArray(result.data)
        ) {

          result.data.forEach(
            nama => {

              const option =
                document.createElement(
                  "option"
                );

              option.value = nama;

              option.textContent = nama;

              select.appendChild(
                option
              );

            }
          );

        }

      } catch (error) {

        console.error(
          "Gagal mengambil ruangan:",
          error
        );

        select.innerHTML =
          '<option value="">Gagal memuat ruangan</option>';

      }

    }


    // =================================================
    // BUKA MODAL TAMBAH RUANGAN
    // =================================================

    function bukaTambahRuangan() {

      document.getElementById(
        "modalRuangan"
      ).style.display = "flex";

    }


    // =================================================
    // TUTUP MODAL
    // =================================================

    function tutupTambahRuangan() {

      document.getElementById(
        "modalRuangan"
      ).style.display = "none";

      document.getElementById(
        "namaRuangan"
      ).value = "";

      document.getElementById(
        "pinAdmin"
      ).value = "";

    }


    // =================================================
    // SIMPAN RUANGAN
    // =================================================

    async function simpanRuangan() {

      const namaRuangan =
        document.getElementById(
          "namaRuangan"
        ).value.trim();


      const pin =
        document.getElementById(
          "pinAdmin"
        ).value.trim();


      if (!namaRuangan) {

        alert(
          "Nama ruangan belum diisi."
        );

        return;

      }


      if (!pin) {

        alert(
          "PIN Admin belum diisi."
        );

        return;

      }


      const data =
        new URLSearchParams();


      data.append(
        "action",
        "tambahRuangan"
      );


      data.append(
        "pin",
        pin
      );


      data.append(
        "namaRuangan",
        namaRuangan
      );


      try {

        const response =
          await fetch(
            API_URL,
            {
              method: "POST",
              body: data
            }
          );


        const result =
          await response.json();


        if (result.berhasil) {

          alert(
            "✅ Ruangan berhasil ditambahkan."
          );

          tutupTambahRuangan();

          await loadRuangan();


          document.getElementById(
            "ruangan"
          ).value =
            result.ruangan;

        } else {

          alert(
            "❌ " +
            result.pesan
          );

        }

      } catch (error) {

        console.error(error);

        alert(
          "❌ Gagal terhubung ke Google Sheet."
        );

      }

    }


    // =================================================
    // QR BERHASIL DIBACA
    // =================================================

    async function hasilScan(
      qrCodeMessage
    ) {

      if (sedangScan) {
        return;
      }


      if (sedangMengirim) {
        return;
      }


      sedangScan = true;


      qrHasil =
        String(
          qrCodeMessage
        ).trim();


      console.log(
        "QR TERBACA:",
        qrHasil
      );


      document.getElementById(
        "hasilScan"
      ).innerText =
        qrHasil;


      // -----------------------------------------------
      // HENTIKAN KAMERA
      // -----------------------------------------------

      try {

        if (scanner) {

          await scanner.stop();

        }

      } catch (error) {

        console.log(
          "Scanner stop:",
          error
        );

      }


      // -----------------------------------------------
      // TAMPILKAN KONFIRMASI
      // -----------------------------------------------

      document.getElementById(
        "konfirmasi"
      ).style.display =
        "block";


      tampilStatus(
        "",
        ""
      );

    }


    // =================================================
    // KONFIRMASI YA / TIDAK
    // =================================================

    async function konfirmasiLengkap(
      pilihan
    ) {

      if (!qrHasil) {

        alert(
          "QR Code belum terbaca."
        );

        return;

      }


      const petugas =
        document.getElementById(
          "petugas"
        ).value;


      const ruangan =
        document.getElementById(
          "ruangan"
        ).value;


      const jumlah =
        document.getElementById(
          "jumlah"
        ).value;


      const transaksi =
        document.getElementById(
          "transaksi"
        ).value;


      // -----------------------------------------------
      // VALIDASI
      // -----------------------------------------------

      if (!petugas) {

        alert(
          "Silakan pilih petugas terlebih dahulu."
        );

        return;

      }


      if (!ruangan) {

        alert(
          "Silakan pilih ruangan terlebih dahulu."
        );

        return;

      }


      if (
        !jumlah ||
        Number(jumlah) < 1
      ) {

        alert(
          "Jumlah harus minimal 1."
        );

        return;

      }


      if (sedangMengirim) {
        return;
      }


      sedangMengirim = true;


      tampilStatus(
        "⏳ Mengirim data ke Google Sheet...",
        "proses"
      );


      // -----------------------------------------------
      // DATA
      // -----------------------------------------------

      const data =
        new URLSearchParams();


      data.append(
        "action",
        "simpanTransaksi"
      );


      data.append(
        "transaksi",
        transaksi
      );


      data.append(
        "petugas",
        petugas
      );


      data.append(
        "namaBarang",
        qrHasil
      );


      data.append(
        "jumlah",
        jumlah
      );


      data.append(
        "ruangan",
        ruangan
      );


      data.append(
        "lengkap",
        pilihan
      );


      data.append(
        "keterangan",
        "SCAN QR"
      );


      // -----------------------------------------------
      // KIRIM
      // -----------------------------------------------

      try {

        const response =
          await fetch(
            API_URL,
            {
              method: "POST",
              body: data
            }
          );


        const result =
          await response.json();


        console.log(
          "HASIL SERVER:",
          result
        );


        if (result.berhasil) {

          tampilStatus(
            "✅ BERHASIL DISIMPAN\n" +
            result.namaBarang +
            " | " +
            result.lengkap,
            "berhasil"
          );


          // Tutup konfirmasi
          document.getElementById(
            "konfirmasi"
          ).style.display =
            "none";


          qrHasil = "";


          // Tunggu sebentar
          // lalu aktifkan scanner kembali

          setTimeout(
            mulaiScanner,
            1800
          );


        } else {

          tampilStatus(
            "❌ GAGAL\n" +
            result.pesan,
            "gagal"
          );


          sedangMengirim =
            false;

        }


      } catch (error) {

        console.error(
          "ERROR:",
          error
        );


        tampilStatus(
          "❌ GAGAL TERHUBUNG KE GOOGLE SHEET",
          "gagal"
        );


        sedangMengirim =
          false;

      }

    }


    // =================================================
    // STATUS
    // =================================================

    function tampilStatus(
      pesan,
      tipe
    ) {

      const status =
        document.getElementById(
          "status"
        );


      if (!pesan) {

        status.style.display =
          "none";

        status.className =
          "status";

        status.innerText =
          "";

        return;

      }


      status.style.display =
        "block";


      status.className =
        "status " +
        tipe;


      status.innerText =
        pesan;

    }


    // =================================================
    // ERROR SCANNER
    // =================================================

    function gagalScan(
      errorMessage
    ) {

      console.log(
        "Scanner:",
        errorMessage
      );

    }


    // =================================================
    // MULAI SCANNER
    // =================================================

    function mulaiScanner() {

      sedangScan =
        false;

      sedangMengirim =
        false;


      document.getElementById(
        "konfirmasi"
      ).style.display =
        "none";


      tampilStatus(
        "",
        ""
      );


      scanner =
        new Html5Qrcode(
          "reader"
        );


      const config = {

        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      };


      scanner.start(

        {
          facingMode:
            "environment"
        },

        config,

        hasilScan,

        gagalScan

      )

      .catch(
        function(error) {

          console.error(
            "Kamera gagal:",
            error
          );


          document.getElementById(
            "hasilScan"
          ).innerText =
            "❌ Kamera tidak dapat digunakan. Pastikan izin kamera diberikan.";

        }
      );

    }


    // =================================================
    // MULAI APLIKASI
    // =================================================

    loadPetugas();

    loadRuangan();

    mulaiScanner();


  </script>

</body>
</html>
